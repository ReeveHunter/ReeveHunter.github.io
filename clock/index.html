<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        /* ---------- Base ---------- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: black;
            color: white;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            overflow: hidden;
            height: 100vh;
        }
        body.dragging, body.dragging * { cursor: grabbing !important; user-select: none; }

        /* ---------- Clock display block (draggable) ---------- */
        #display {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            /* Sizes, set by the sliders in the menu */
            --clock-size: 140px;
            --bar-scale: 1;
            --status-size: 36px;
        }
        #time {
            font-size: var(--clock-size);
            letter-spacing: 2px;
            line-height: 1.1;
            white-space: nowrap;
        }
        #status {
            font-size: var(--status-size);
            color: #888;
            min-height: 1.22em;
            white-space: nowrap;
        }
        #progress { width: calc(500px * var(--bar-scale)); max-width: 90vw; }
        #progress-bar {
            width: 100%;
            height: calc(30px * var(--bar-scale));
            background: #333;
            border-radius: calc(15px * var(--bar-scale));
            overflow: hidden;
        }
        #progress-fill {
            height: 100%;
            width: 0%;
            background: #888;
            border-radius: calc(15px * var(--bar-scale));
            transition: width 0.3s;
        }
        #message {
            color: #ff6b6b;
            font-size: 18px;
            text-align: center;
        }

        /* ---------- Menu panel ---------- */
        #menu {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: rgba(30, 30, 30, 0.95);
            padding: 20px;
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: max-content;
            align-items: start;
            font-size: 14px;
            color: #ddd;
            opacity: 0;
            transform: translateY(-100%);
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
        }
        #menu.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }

        .section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 0 28px;
            border-left: 1px solid #444;
            align-self: stretch;
        }
        .section:first-child { padding-left: 0; border-left: none; }
        .section h2 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 2px;
        }
        .row { display: flex; align-items: center; gap: 8px; min-height: 34px; }

        /* Times: label column + input column */
        .times {
            display: grid;
            grid-template-columns: 56px auto;
            gap: 8px 10px;
            align-items: center;
        }
        .times > label { text-align: right; color: #bbb; }
        .times .clear-btn { grid-column: 2; justify-self: start; }

        /* Controls */
        #menu input[type="time"],
        #menu input[type="number"],
        #menu button {
            height: 34px;
            font: inherit;
            font-size: 14px;
            color: white;
            border-radius: 4px;
        }
        #menu input[type="time"],
        #menu input[type="number"] {
            background: #333;
            border: 1px solid #555;
            padding: 0 8px;
            color-scheme: dark;
        }
        #menu input[type="time"] { width: 130px; }
        #menu input[type="number"] { width: 72px; }
        #menu input:focus { outline: 2px solid #777; outline-offset: 1px; }
        #menu input:disabled { opacity: 0.55; cursor: not-allowed; }
        #menu button {
            background: #555;
            border: none;
            padding: 0 16px;
            cursor: pointer;
        }
        #menu button:hover { background: #666; }
        .suffix { color: #888; }
        .dimmed { opacity: 0.4; }
        input[type="checkbox"] { accent-color: #4a8fd8; width: 16px; height: 16px; }
        .check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }

        /* Pill switches */
        .switch { position: relative; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
        .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
        .switch .track {
            position: relative;
            flex: none;
            width: 34px; height: 18px;
            border-radius: 9px;
            background: #555;
            transition: background 0.2s;
        }
        .switch .track::after {
            content: '';
            position: absolute;
            top: 2px; left: 2px;
            width: 14px; height: 14px;
            border-radius: 50%;
            background: #ddd;
            transition: transform 0.2s;
        }
        .switch input:checked + .track { background: #4a8fd8; }
        .switch input:checked + .track::after { transform: translateX(16px); background: #fff; }
        .switch input:focus-visible + .track { outline: 2px solid #888; outline-offset: 2px; }
        .switch.small { font-size: 12px; color: #aaa; margin-left: 6px; }

        /* Size sliders: label | slider | value | reset, in aligned columns */
        .sliders {
            display: grid;
            grid-template-columns: max-content 150px 48px 28px;
            gap: 2px 10px;
            align-items: center;
        }
        .sliders > label { color: #bbb; }
        #menu input[type="range"] {
            width: 150px;
            height: 34px;
            accent-color: #4a8fd8;
            cursor: pointer;
        }
        .size-value { width: 48px; color: #aaa; font-size: 13px; font-variant-numeric: tabular-nums; }
        #menu button.icon-btn {
            width: 28px;
            height: 28px;
            padding: 0;
            font-size: 15px;
            line-height: 1;
        }

        /* Narrow screens: stack sections */
        @media (max-width: 760px) {
            #menu { grid-auto-flow: row; grid-auto-columns: auto; }
            .section { padding: 14px 0; border-left: none; border-top: 1px solid #444; }
            .section:first-child { padding-top: 0; border-top: none; }
        }
    </style>
</head>
<body>
    <!-- ---------- Menu ---------- -->
    <div id="menu">
        <section class="section">
            <h2>Times</h2>
            <div class="times">
                <label for="start">Start</label>
                <input type="time" id="start">

                <label for="end">End</label>
                <input type="time" id="end">

                <label for="length">Length</label>
                <div class="row">
                    <input type="number" id="length" min="1">
                    <span class="suffix">min</span>
                    <label class="switch small" title="On: changing Start moves End and keeps Length. Off: changing Start updates Length and keeps End.">
                        <input type="checkbox" id="length-toggle">
                        <span class="track"></span>
                        Set by length
                    </label>
                </div>

                <button type="button" class="clear-btn" id="clear">Clear</button>
            </div>
        </section>

        <section class="section">
            <h2>Display</h2>
            <div class="row">
                <label class="switch">
                    <input type="checkbox" id="progress-toggle" checked>
                    <span class="track"></span>
                    Progress bar
                </label>
            </div>
            <div class="row">
                <label class="switch">
                    <input type="checkbox" id="end-toggle" checked>
                    <span class="track"></span>
                    End time
                </label>
            </div>
            <div class="row" id="extra-row">
                <label class="check">
                    <input type="checkbox" id="extra-toggle">
                    Extra time
                </label>
                <input type="number" id="extra-minutes" min="1" value="5" disabled>
                <span class="suffix">min</span>
            </div>
        </section>

        <section class="section">
            <h2>Size &amp; Position</h2>
            <div class="sliders">
                <label for="clock-size">Clock</label>
                <input type="range" id="clock-size" min="60" max="400" step="5">
                <span class="size-value" id="clock-size-value"></span>
                <button type="button" class="icon-btn" id="clock-size-reset" title="Reset clock size">&#8634;</button>

                <label for="bar-size">Progress bar</label>
                <input type="range" id="bar-size" min="50" max="250" step="5">
                <span class="size-value" id="bar-size-value"></span>
                <button type="button" class="icon-btn" id="bar-size-reset" title="Reset progress bar size">&#8634;</button>

                <label for="status-size">End time</label>
                <input type="range" id="status-size" min="16" max="120" step="2">
                <span class="size-value" id="status-size-value"></span>
                <button type="button" class="icon-btn" id="status-size-reset" title="Reset end time text size">&#8634;</button>
            </div>
            <div class="row">
                <label class="switch">
                    <input type="checkbox" id="lock-h-toggle">
                    <span class="track"></span>
                    Lock to horizontal center
                </label>
            </div>
            <div class="row">
                <label class="switch">
                    <input type="checkbox" id="lock-v-toggle">
                    <span class="track"></span>
                    Lock to vertical center
                </label>
            </div>
        </section>
    </div>

    <!-- ---------- Clock display (one draggable block) ---------- -->
    <div id="display" title="Drag to move · double-click to center">
        <div id="time">12:00</div>
        <div id="status" style="display: none;"></div>
        <div id="progress" style="display: none;">
            <div id="progress-bar"><div id="progress-fill"></div></div>
        </div>
        <div id="message" style="display: none;"></div>
    </div>

    <script>
    (() => {
        'use strict';

        // ---------- Elements ----------
        const $ = id => document.getElementById(id);
        const el = {
            menu: $('menu'), display: $('display'),
            time: $('time'), status: $('status'),
            progress: $('progress'), fill: $('progress-fill'), message: $('message'),
            start: $('start'), end: $('end'), length: $('length'),
            lengthToggle: $('length-toggle'), clear: $('clear'),
            progressToggle: $('progress-toggle'), endToggle: $('end-toggle'),
            extraToggle: $('extra-toggle'), extraMinutes: $('extra-minutes'), extraRow: $('extra-row'),
            lockH: $('lock-h-toggle'), lockV: $('lock-v-toggle'),
        };

        // Size sliders: each sets a CSS variable on the display block
        const SLIDERS = [
            { id: 'clock-size',  def: 140, unit: 'px', cssVar: '--clock-size',  css: v => `${v}px` },
            { id: 'bar-size',    def: 100, unit: '%',  cssVar: '--bar-scale',   css: v => v / 100 },
            { id: 'status-size', def: 36,  unit: 'px', cssVar: '--status-size', css: v => `${v}px` },
        ];
        const menuInputs = [el.start, el.end, el.length, el.extraMinutes, ...SLIDERS.map(sl => $(sl.id))];

        // ---------- State ----------
        let startMin = null;                 // start time, minutes after midnight (or null)
        let endMin = null;                   // end time, minutes after midnight (or null)
        let pos = { fx: 0.5, fy: 0.5 };      // block center as a fraction of the viewport
        let drag = null;                     // active drag: { id, dx, dy }
        const menu = { visible: false, hovered: false, lastActive: 0, lastTyped: 0 };

        // ---------- Time helpers ----------
        const pad = n => String(n).padStart(2, '0');
        const parseTime = v => {
            if (!v) return null;
            const [h, m] = v.split(':').map(Number);
            return Number.isFinite(h) && Number.isFinite(m) ? h * 60 + m : null;
        };
        const toInputValue = min => `${pad(Math.floor(min / 60))}:${pad(min % 60)}`;
        const fmt12 = min => {
            const h = Math.floor(min / 60) % 24, m = min % 60;
            return `${h % 12 || 12}:${pad(m)} ${h >= 12 ? 'PM' : 'AM'}`;
        };
        const clamp = (v, lo, hi) => lo > hi ? (lo + hi) / 2 : Math.min(hi, Math.max(lo, v));

        // ---------- Render (called on every change and every tick) ----------
        function render() {
            const now = new Date();
            el.time.textContent = `${now.getHours() % 12 || 12}:${pad(now.getMinutes())}`;

            // Control states (Extra Time needs the bar or the end time line to be showing)
            const barOn = el.progressToggle.checked, endOn = el.endToggle.checked;
            const anyOn = barOn || endOn;
            if (!anyOn) el.extraToggle.checked = false;
            el.extraToggle.disabled = !anyOn;
            el.extraMinutes.disabled = !(anyOn && el.extraToggle.checked);
            el.extraRow.classList.toggle('dimmed', !anyOn);

            // Status line needs an End time; the bar needs Start and End. Anything unset is simply hidden.
            let status = '', message = '', fill = null;
            if (anyOn && startMin !== null && endMin !== null && endMin <= startMin) {
                message = 'End time must be after start time';
            } else if (endMin !== null) {
                const nowMin = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
                const extra = parseInt(el.extraMinutes.value, 10) || 0;
                const inExtra = el.extraToggle.checked && extra > 0 && nowMin >= endMin;
                const finalEnd = inExtra ? endMin + extra : endMin;

                if (endOn) {
                    status = nowMin >= finalEnd ? 'Times Up!'
                           : inExtra ? `Extra Time until ${fmt12(finalEnd)}`
                           : `End Time: ${fmt12(endMin)}`;
                }
                if (barOn && startMin !== null) {
                    fill = nowMin >= finalEnd ? 1
                         : nowMin > startMin ? (nowMin - startMin) / (finalEnd - startMin)
                         : 0;
                }
            }
            el.status.textContent = status;
            el.status.style.display = status ? 'block' : 'none';
            el.progress.style.display = fill === null ? 'none' : 'block';
            if (fill !== null) el.fill.style.width = `${fill * 100}%`;
            el.message.textContent = message;
            el.message.style.display = message ? 'block' : 'none';

            saveSettings();

            placeBlock();
        }

        // ---------- Time inputs ----------
        // Length edited       → "Set by length" turns on; End = Start + Length.
        // Start edited, on    → End = Start + Length (Length kept).
        // End edited, on      → Start = End − Length (Length kept).
        // Start/End edited, off → Length = End − Start.
        function syncLength() {
            if (startMin === null || endMin === null) return;       // keep whatever Length says
            el.length.value = endMin > startMin ? endMin - startMin : '';
        }

        // End = Start + Length, if both are usable and it stays on the same day
        function endFromLength() {
            const n = parseInt(el.length.value, 10);
            if (startMin === null || !(n >= 1) || startMin + n >= 1440) return false;
            endMin = startMin + n;
            el.end.value = toInputValue(endMin);
            return true;
        }

        function onStart() {
            startMin = parseTime(el.start.value);
            // Toggle on (or no End yet): move End to keep Length. Otherwise keep End and recompute Length.
            if ((el.lengthToggle.checked || endMin === null) && endFromLength()) { render(); return; }
            syncLength();
            render();
        }
        function onEnd() {
            endMin = parseTime(el.end.value);
            // Toggle on: move Start to keep Length. Otherwise keep Start and recompute Length.
            const n = parseInt(el.length.value, 10);
            if (el.lengthToggle.checked && endMin !== null && n >= 1 && endMin - n >= 0) {
                startMin = endMin - n;
                el.start.value = toInputValue(startMin);
                render();
                return;
            }
            syncLength();
            render();
        }

        function onLength() {
            const n = parseInt(el.length.value, 10);
            if (n >= 1) {
                el.lengthToggle.checked = true;       // typing a length turns on "Set by length"
                if (startMin === null) {
                    const now = new Date();
                    startMin = Math.min(1439, Math.round(now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60));
                    el.start.value = toInputValue(startMin);
                }
                endFromLength();
            }
            render();
        }

        ['input', 'change'].forEach(type => {
            el.start.addEventListener(type, onStart);
            el.end.addEventListener(type, onEnd);
            el.length.addEventListener(type, onLength);
            el.extraMinutes.addEventListener(type, render);
        });

        el.clear.addEventListener('click', () => {
            startMin = endMin = null;
            el.start.value = el.end.value = el.length.value = '';
            render();
        });

        // ---------- Display toggles ----------
        el.progressToggle.addEventListener('change', render);
        el.endToggle.addEventListener('change', render);
        el.extraToggle.addEventListener('change', render);

        // ---------- Positioning & dragging ----------
        function placeBlock() {
            const W = window.innerWidth, H = window.innerHeight;
            const w = el.display.offsetWidth, h = el.display.offsetHeight;
            if (el.lockH.checked) pos.fx = 0.5;        // locked to horizontal center
            if (el.lockV.checked) pos.fy = 0.5;        // locked to vertical center
            const x = clamp(pos.fx * W, w / 2, W - w / 2);
            const y = clamp(pos.fy * H, h / 2, H - h / 2);
            pos.fx = x / W; pos.fy = y / H;   // keep stored position inside the viewport
            el.display.style.left = `${x}px`;
            el.display.style.top = `${y}px`;
        }

        el.display.addEventListener('pointerdown', e => {
            if (e.button !== 0) return;
            e.preventDefault();
            const rect = el.display.getBoundingClientRect();
            drag = {
                id: e.pointerId,
                dx: e.clientX - (rect.left + rect.width / 2),
                dy: e.clientY - (rect.top + rect.height / 2),
            };
            el.display.setPointerCapture(e.pointerId);
            document.body.classList.add('dragging');
        });

        el.display.addEventListener('pointermove', e => {
            if (!drag || e.pointerId !== drag.id) return;
            pos.fx = (e.clientX - drag.dx) / window.innerWidth;
            pos.fy = (e.clientY - drag.dy) / window.innerHeight;
            placeBlock();
        });

        function endDrag(e) {
            if (!drag || e.pointerId !== drag.id) return;
            drag = null;
            document.body.classList.remove('dragging');
        }
        el.display.addEventListener('pointerup', endDrag);
        el.display.addEventListener('pointercancel', endDrag);

        function resetPosition() { pos = { fx: 0.5, fy: 0.5 }; placeBlock(); }
        el.display.addEventListener('dblclick', resetPosition);   // double-click the clock to re-center
        el.lockH.addEventListener('change', placeBlock);   // on → snaps to horizontal center
        el.lockV.addEventListener('change', placeBlock);   // on → snaps to vertical center
        window.addEventListener('resize', placeBlock);

        // ---------- Sizes ----------
        SLIDERS.forEach(sl => {
            const input = $(sl.id), label = $(`${sl.id}-value`);
            const apply = () => {
                el.display.style.setProperty(sl.cssVar, sl.css(input.value));
                label.textContent = `${input.value}${sl.unit}`;
                placeBlock();                // re-clamp: a bigger block may now overflow an edge
            };
            input.addEventListener('input', apply);
            $(`${sl.id}-reset`).addEventListener('click', () => { input.value = sl.def; apply(); });
            input.value = sl.def;            // fresh start on every load (ignore browser form restore)
            apply();
        });

        // ---------- Menu visibility ----------
        const MENU_ZONE = 100;     // px from top that reveals the menu
        const HIDE_DELAY = 3000;

        function showMenu() {
            menu.visible = true;
            menu.lastActive = Date.now();
            el.menu.classList.add('visible');
        }
        function hideMenu() {
            menu.visible = false;
            el.menu.classList.remove('visible');
        }
        function menuShouldStay() {
            return menu.hovered
                || menuInputs.includes(document.activeElement)
                || Date.now() - menu.lastTyped < HIDE_DELAY;
        }

        document.addEventListener('mousemove', e => {
            if (!drag && e.clientY < MENU_ZONE) showMenu();
        });
        // Close right away (blurring any menu input), e.g. on Escape or a click outside the menu
        function closeMenuNow() {
            if (el.menu.contains(document.activeElement)) document.activeElement.blur();
            menu.hovered = false;
            menu.lastTyped = 0;
            hideMenu();
        }

        // Click outside the open menu closes it. On the clock itself, only a click
        // (press + release without moving) closes it, so dragging never does.
        let clickOffStart = null;
        document.addEventListener('pointerdown', e => {
            if (menu.visible) {
                if (el.menu.contains(e.target)) return;
                if (el.display.contains(e.target)) clickOffStart = { x: e.clientX, y: e.clientY };
                else closeMenuNow();
            } else if (e.pointerType !== 'mouse' && !el.display.contains(e.target) && e.clientY < MENU_ZONE) {
                showMenu();                                // tap at the top on touch screens
            }
        });
        document.addEventListener('pointerup', e => {
            if (clickOffStart && Math.hypot(e.clientX - clickOffStart.x, e.clientY - clickOffStart.y) < 5) closeMenuNow();
            clickOffStart = null;
        });
        el.menu.addEventListener('pointerenter', () => { menu.hovered = true; });
        el.menu.addEventListener('pointerleave', () => { menu.hovered = false; menu.lastActive = Date.now(); });
        menuInputs.forEach(input => {
            input.addEventListener('input', () => { menu.lastTyped = Date.now(); });
            input.addEventListener('keydown', () => { menu.lastTyped = Date.now(); });
        });

        // Poll: hide once nothing has kept the menu open for HIDE_DELAY
        setInterval(() => {
            if (!menu.visible || drag) return;
            if (menuShouldStay()) menu.lastActive = Date.now();
            else if (Date.now() - menu.lastActive >= HIDE_DELAY) hideMenu();
        }, 200);

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeMenuNow();
        });

        // ---------- Remembered settings (Start, End and Extra Time persist between loads) ----------
        const STORAGE_KEY = 'classroomClock.times';
        let savedJSON = '';
        function saveSettings() {
            const value = JSON.stringify({
                start: startMin,
                end: endMin,
                extraOn: el.extraToggle.checked,
                extraMins: parseInt(el.extraMinutes.value, 10) || null,
            });
            if (value === savedJSON) return;           // only write when something changed
            savedJSON = value;
            try { localStorage.setItem(STORAGE_KEY, value); } catch (e) { /* storage unavailable */ }
        }
        function loadSettings() {
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                if (!saved) return;
                const validTime = v => Number.isInteger(v) && v >= 0 && v < 1440 ? v : null;
                startMin = validTime(saved.start);
                endMin = validTime(saved.end);
                el.extraToggle.checked = saved.extraOn === true;
                if (Number.isInteger(saved.extraMins) && saved.extraMins >= 1) el.extraMinutes.value = saved.extraMins;
            } catch (e) { /* storage unavailable or corrupt: keep defaults */ }
        }

        // ---------- Start fresh: everything else back to defaults ----------
        el.progressToggle.checked = el.endToggle.checked = true;
        el.lengthToggle.checked = el.extraToggle.checked = el.lockH.checked = el.lockV.checked = false;
        el.extraMinutes.value = 5;
        loadSettings();
        el.start.value = startMin === null ? '' : toInputValue(startMin);
        el.end.value = endMin === null ? '' : toInputValue(endMin);
        el.length.value = '';
        syncLength();

        // ---------- Tick (aligned to the second) ----------
        function tick() {
            render();
            setTimeout(tick, 1000 - (Date.now() % 1000) + 10);
        }
        tick();
    })();
    </script>
</body>
</html>
