<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: black;
            color: white;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            height: 100vh;
        }
        #menu {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(30, 30, 30, 0.95);
            padding: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            opacity: 0;
            transform: translateY(-100%);
            transition: opacity 0.3s, transform 0.3s;
            z-index: 1000;
        }
        #menu.visible {
            opacity: 1;
            transform: translateY(0);
        }
        #menu input[type="time"],
        #menu input[type="number"] {
            padding: 8px;
            background: #333;
            border: 1px solid #555;
            color: white;
            border-radius: 4px;
        }
        #menu button {
            padding: 8px 16px;
            background: #555;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }
        #menu button:hover {
            background: #666;
        }
        #menu label {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .menu-group {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 5px 10px;
            background: rgba(50, 50, 50, 0.5);
            border-radius: 6px;
        }
        #clock-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 30px;
        }
        #time {
            font-size: 120px;
            font-weight: 700;
            letter-spacing: 2px;
        }
        #end-time-display {
            font-size: 36px;
            color: #888;
            min-height: 44px;
        }
        #progress-container {
            width: 500px;
        }
        #progress-bar {
            width: 100%;
            height: 30px;
            background: #333;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }
        #progress-fill {
            height: 100%;
            background: #888;
            width: 0%;
            transition: width 0.3s;
        }
        #error-message {
            color: #ff6b6b;
            font-size: 18px;
            margin-top: 10px;
            min-height: 22px;
        }
        input[type="number"]:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="menu">
        <div class="menu-group">
            <span>Start:</span>
            <input type="time" id="start-time">
            <button onclick="setStartTime()">Set</button>
            <button onclick="useNow()">Use Now</button>
        </div>
        <div class="menu-group">
            <span>End:</span>
            <input type="time" id="end-time">
            <button onclick="setEndTime()">Set</button>
            <button onclick="clearEndTime()">Clear</button>
        </div>
        <div class="menu-group">
            <label>
                <input type="checkbox" id="progress-checkbox" onchange="toggleProgress()">
                Progress Bar
            </label>
        </div>
        <div class="menu-group">
            <label>
                <input type="checkbox" id="extra-time-checkbox" onchange="toggleExtraTime()">
                Extra Time
            </label>
            <input type="number" id="extra-minutes" min="1" value="30" disabled>
            <span>minutes</span>
        </div>
    </div>

    <div id="clock-container">
        <div id="time">12:00</div>
        <div id="end-time-display"></div>
        <div id="progress-container" style="display: none;">
            <div id="progress-bar">
                <div id="progress-fill"></div>
            </div>
            <div id="error-message"></div>
        </div>
    </div>

    <script>
        let startTime = null;
        let endTime = null;
        let progressEnabled = false;
        let extraTimeEnabled = false;
        let menuTimeout;
        let typingTimeout;
        let isTyping = false;

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            const timeStr = `${hours}:${minutes.toString().padStart(2, '0')}`;
            document.getElementById('time').textContent = timeStr;

            if (progressEnabled) {
                updateProgress();
            }
        }

        function timeToMinutes(timeStr) {
            const [hours, minutes] = timeStr.split(':').map(Number);
            return hours * 60 + minutes;
        }

        function minutesToTime12Hour(minutes) {
            let hours = Math.floor(minutes / 60) % 24;
            const mins = minutes % 60;
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            return `${hours}:${mins.toString().padStart(2, '0')} ${ampm}`;
        }

        function getCurrentMinutes() {
            const now = new Date();
            return now.getHours() * 60 + now.getMinutes();
        }

        function updateProgress() {
            const errorMsg = document.getElementById('error-message');
            const endTimeDisplay = document.getElementById('end-time-display');
            const progressFill = document.getElementById('progress-fill');

            errorMsg.textContent = '';
            
            if (!startTime || !endTime) {
                endTimeDisplay.textContent = '';
                progressFill.style.width = '0%';
                if (!startTime && !endTime) {
                    errorMsg.textContent = 'Please set start and end times';
                } else if (!startTime) {
                    errorMsg.textContent = 'Please set start time';
                } else {
                    errorMsg.textContent = 'Please set end time';
                }
                return;
            }

            const currentMinutes = getCurrentMinutes();
            const startMinutes = timeToMinutes(startTime);
            const originalEndMinutes = timeToMinutes(endTime);
            let endMinutes = originalEndMinutes;
            let displayEndTime = endTime;
            let isExtraTime = false;

            // Check if we're past the original end time and extra time is enabled
            if (currentMinutes >= originalEndMinutes && extraTimeEnabled) {
                const extraMins = parseInt(document.getElementById('extra-minutes').value) || 0;
                endMinutes = originalEndMinutes + extraMins;
                displayEndTime = minutesToTime12Hour(endMinutes);
                isExtraTime = true;
            }

            // Calculate progress first to determine if we're truly done
            let progressPercentage = 0;
            let isDone = false;

            if (currentMinutes < startMinutes) {
                // Before start time - show empty bar silently
                progressPercentage = 0;
            } else if (currentMinutes >= endMinutes) {
                // At or after final end time (including extended end time)
                progressPercentage = 100;
                isDone = true;
            } else {
                // Between start and end
                const totalDuration = endMinutes - startMinutes;
                const elapsed = currentMinutes - startMinutes;
                progressPercentage = (elapsed / totalDuration) * 100;
            }

            progressFill.style.width = `${progressPercentage}%`;

            // Display end time or Times Up message
            if (isDone) {
                endTimeDisplay.textContent = 'Times Up!';
            } else if (isExtraTime) {
                endTimeDisplay.textContent = `Extra Time until ${displayEndTime}`;
            } else {
                const [hours, mins] = endTime.split(':').map(Number);
                const ampm = hours >= 12 ? 'PM' : 'AM';
                const displayHours = hours % 12 || 12;
                endTimeDisplay.textContent = `End Time: ${displayHours}:${mins.toString().padStart(2, '0')} ${ampm}`;
            }
        }

        function setStartTime() {
            const input = document.getElementById('start-time').value;
            if (input) {
                startTime = input;
                if (progressEnabled) updateProgress();
            }
        }

        function setEndTime() {
            const input = document.getElementById('end-time').value;
            if (input) {
                endTime = input;
                if (progressEnabled) updateProgress();
            }
        }

        function clearEndTime() {
            endTime = null;
            document.getElementById('end-time').value = '';
            document.getElementById('end-time-display').textContent = '';
            document.getElementById('progress-fill').style.width = '0%';
            if (progressEnabled) updateProgress();
        }

        function useNow() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const timeStr = `${hours}:${minutes}`;
            document.getElementById('start-time').value = timeStr;
            startTime = timeStr;
            if (progressEnabled) updateProgress();
        }

        function toggleProgress() {
            progressEnabled = document.getElementById('progress-checkbox').checked;
            const container = document.getElementById('progress-container');
            container.style.display = progressEnabled ? 'block' : 'none';
            
            if (!progressEnabled) {
                document.getElementById('extra-time-checkbox').checked = false;
                extraTimeEnabled = false;
                document.getElementById('extra-minutes').disabled = true;
            }
            
            if (progressEnabled) {
                updateProgress();
            }
        }

        function toggleExtraTime() {
            extraTimeEnabled = document.getElementById('extra-time-checkbox').checked;
            document.getElementById('extra-minutes').disabled = !extraTimeEnabled || !progressEnabled;
            
            if (!progressEnabled && extraTimeEnabled) {
                document.getElementById('extra-time-checkbox').checked = false;
                extraTimeEnabled = false;
                document.getElementById('extra-minutes').disabled = true;
            }
            
            if (progressEnabled) updateProgress();
        }

        function showMenu() {
            const menu = document.getElementById('menu');
            menu.classList.add('visible');
            clearTimeout(menuTimeout);
            if (!isTyping) {
                menuTimeout = setTimeout(() => {
                    menu.classList.remove('visible');
                }, 3000);
            }
        }

        function hideMenuDelayed() {
            if (!isTyping) {
                clearTimeout(menuTimeout);
                menuTimeout = setTimeout(() => {
                    document.getElementById('menu').classList.remove('visible');
                }, 3000);
            }
        }

        // Menu visibility handling
        document.addEventListener('mousemove', (e) => {
            if (e.clientY < 100) {
                showMenu();
            }
        });

        // Handle typing in inputs
        const inputs = document.querySelectorAll('#menu input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                isTyping = true;
                clearTimeout(menuTimeout);
            });

            input.addEventListener('blur', () => {
                isTyping = false;
                hideMenuDelayed();
            });

            input.addEventListener('input', () => {
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => {
                    isTyping = false;
                    hideMenuDelayed();
                }, 3000);
            });
        });

        // Update clock every second
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
