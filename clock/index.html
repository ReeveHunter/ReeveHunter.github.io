<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        /* ---------- Base ---------- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: black;
            color: white;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            overflow: hidden;
            height: 100vh;
        }
        body.dragging, body.dragging * { cursor: grabbing !important; user-select: none; }

        /* ---------- Clock display block (draggable) ---------- */
        #display {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        #time {
            font-size: 140px;            /* default; the Size slider overrides this */
            letter-spacing: 2px;
            line-height: 1.1;
            white-space: nowrap;
        }
        #status {
            font-size: 36px;
            color: #888;
            min-height: 44px;
            white-space: nowrap;
        }
        #progress { width: 500px; max-width: 90vw; }
        #progress-bar {
            width: 100%;
            height: 30px;
            background: #333;
            border-radius: 15px;
            overflow: hidden;
        }
        #progress-fill {
            height: 100%;
            width: 0%;
            background: #888;
            border-radius: 15px;
            transition: width 0.3s;
        }
        #message {
            color: #ff6b6b;
            font-size: 18px;
            margin-top: 10px;
            min-height: 22px;
            text-align: center;
        }

        /* ---------- Menu panel ---------- */
        #menu {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: rgba(30, 30, 30, 0.95);
            padding: 20px;
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: max-content;
            align-items: start;
            font-size: 14px;
            color: #ddd;
            opacity: 0;
            transform: translateY(-100%);
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
        }
        #menu.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }

        .section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 0 28px;
            border-left: 1px solid #444;
            align-self: stretch;
        }
        .section:first-child { padding-left: 0; border-left: none; }
        .section h2 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 2px;
        }
        .row { display: flex; align-items: center; gap: 8px; min-height: 34px; }

        /* Times: label column + input column */
        .times {
            display: grid;
            grid-template-columns: 56px auto;
            gap: 8px 10px;
            align-items: center;
        }
        .times > label { text-align: right; color: #bbb; }
        .times .clear-btn { grid-column: 2; justify-self: start; }

        /* Controls */
        #menu input[type="time"],
        #menu input[type="number"],
        #menu button {
            height: 34px;
            font: inherit;
            font-size: 14px;
            color: white;
            border-radius: 4px;
        }
        #menu input[type="time"],
        #menu input[type="number"] {
            background: #333;
            border: 1px solid #555;
            padding: 0 8px;
            color-scheme: dark;
        }
        #menu input[type="time"] { width: 130px; }
        #menu input[type="number"] { width: 72px; }
        #menu input:focus { outline: 2px solid #777; outline-offset: 1px; }
        #menu input:disabled { opacity: 0.55; cursor: not-allowed; }
        #menu button {
            background: #555;
            border: none;
            padding: 0 16px;
            cursor: pointer;
        }
        #menu button:hover { background: #666; }
        .suffix { color: #888; }
        .dimmed { opacity: 0.4; }
        input[type="checkbox"] { accent-color: #4a8fd8; width: 16px; height: 16px; }
        .check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }

        /* Pill switches */
        .switch { position: relative; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
        .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
        .switch .track {
            position: relative;
            flex: none;
            width: 34px; height: 18px;
            border-radius: 9px;
            background: #555;
            transition: background 0.2s;
        }
        .switch .track::after {
            content: '';
            position: absolute;
            top: 2px; left: 2px;
            width: 14px; height: 14px;
            border-radius: 50%;
            background: #ddd;
            transition: transform 0.2s;
        }
        .switch input:checked + .track { background: #4a8fd8; }
        .switch input:checked + .track::after { transform: translateX(16px); background: #fff; }
        .switch input:focus-visible + .track { outline: 2px solid #888; outline-offset: 2px; }
        .switch.small { font-size: 12px; color: #aaa; margin-left: 6px; }

        /* Size slider */
        #menu input[type="range"] {
            width: 150px;
            height: 34px;
            accent-color: #4a8fd8;
            cursor: pointer;
        }
        .size-value { width: 48px; color: #aaa; font-size: 13px; font-variant-numeric: tabular-nums; }
        #menu button.icon-btn {
            width: 28px;
            height: 28px;
            padding: 0;
            font-size: 15px;
            line-height: 1;
        }

        /* Narrow screens: stack sections */
        @media (max-width: 760px) {
            #menu { grid-auto-flow: row; grid-auto-columns: auto; }
            .section { padding: 14px 0; border-left: none; border-top: 1px solid #444; }
            .section:first-child { padding-top: 0; border-top: none; }
        }
    </style>
</head>
<body>
    <!-- ---------- Menu ---------- -->
    <div id="menu">
        <section class="section">
            <h2>Times</h2>
            <div class="times">
                <label for="start">Start</label>
                <input type="time" id="start">

                <label for="end">End</label>
                <input type="time" id="end">

                <label for="length">Length</label>
                <div class="row">
                    <input type="number" id="length" min="1" disabled>
                    <span class="suffix">min</span>
                    <label class="switch small" title="Set end time from length">
                        <input type="checkbox" id="length-toggle">
                        <span class="track"></span>
                        Set by length
                    </label>
                </div>

                <button type="button" class="clear-btn" id="clear">Clear</button>
            </div>
        </section>

        <section class="section">
            <h2>Display</h2>
            <div class="row">
                <label class="switch">
                    <input type="checkbox" id="progress-toggle">
                    <span class="track"></span>
                    Progress bar
                </label>
            </div>
            <div class="row" id="extra-row">
                <label class="check">
                    <input type="checkbox" id="extra-toggle">
                    Extra time
                </label>
                <input type="number" id="extra-minutes" min="1" value="5" disabled>
                <span class="suffix">min</span>
            </div>
        </section>

        <section class="section">
            <h2>Size &amp; Position</h2>
            <div class="row">
                <label for="size" style="color:#bbb">Size</label>
                <input type="range" id="size" min="60" max="400" step="5" value="140">
                <span class="size-value" id="size-value">140px</span>
                <button type="button" class="icon-btn" id="reset-size" title="Reset size to default">&#8634;</button>
            </div>
            <div class="row">
                <label class="switch">
                    <input type="checkbox" id="free-toggle">
                    <span class="track"></span>
                    Free move
                </label>
            </div>
            <div class="row">
                <button type="button" id="reset-pos">Reset position</button>
            </div>
        </section>
    </div>

    <!-- ---------- Clock display (one draggable block) ---------- -->
    <div id="display" title="Drag to move · double-click to center">
        <div id="time">12:00</div>
        <div id="status"></div>
        <div id="progress" style="display: none;">
            <div id="progress-bar"><div id="progress-fill"></div></div>
            <div id="message"></div>
        </div>
    </div>

    <script>
    (() => {
        'use strict';

        // ---------- Elements ----------
        const $ = id => document.getElementById(id);
        const el = {
            menu: $('menu'), display: $('display'),
            time: $('time'), status: $('status'),
            progress: $('progress'), fill: $('progress-fill'), message: $('message'),
            start: $('start'), end: $('end'), length: $('length'),
            lengthToggle: $('length-toggle'), clear: $('clear'),
            progressToggle: $('progress-toggle'),
            extraToggle: $('extra-toggle'), extraMinutes: $('extra-minutes'), extraRow: $('extra-row'),
            freeToggle: $('free-toggle'), resetPos: $('reset-pos'),
            size: $('size'), sizeValue: $('size-value'), resetSize: $('reset-size'),
        };
        const menuInputs = [el.start, el.end, el.length, el.extraMinutes, el.size];
        const DEFAULT_SIZE = 140;            // clock font size in px

        // ---------- State ----------
        let startMin = null;                 // start time, minutes after midnight (or null)
        let endMin = null;                   // end time, minutes after midnight (or null)
        let pos = { fx: 0.5, fy: 0.5 };      // block center as a fraction of the viewport
        let drag = null;                     // active drag: { id, dx, dy }
        const menu = { visible: false, hovered: false, lastActive: 0, lastTyped: 0 };

        // ---------- Time helpers ----------
        const pad = n => String(n).padStart(2, '0');
        const parseTime = v => {
            if (!v) return null;
            const [h, m] = v.split(':').map(Number);
            return Number.isFinite(h) && Number.isFinite(m) ? h * 60 + m : null;
        };
        const toInputValue = min => `${pad(Math.floor(min / 60))}:${pad(min % 60)}`;
        const fmt12 = min => {
            const h = Math.floor(min / 60) % 24, m = min % 60;
            return `${h % 12 || 12}:${pad(m)} ${h >= 12 ? 'PM' : 'AM'}`;
        };
        const clamp = (v, lo, hi) => lo > hi ? (lo + hi) / 2 : Math.min(hi, Math.max(lo, v));

        // ---------- Render (called on every change and every tick) ----------
        function render() {
            const now = new Date();
            el.time.textContent = `${now.getHours() % 12 || 12}:${pad(now.getMinutes())}`;

            // Control states
            const progressOn = el.progressToggle.checked;
            if (!progressOn) el.extraToggle.checked = false;
            el.extraToggle.disabled = !progressOn;
            el.extraMinutes.disabled = !(progressOn && el.extraToggle.checked);
            el.extraRow.classList.toggle('dimmed', !progressOn);
            el.length.disabled = !el.lengthToggle.checked;
            el.progress.style.display = progressOn ? 'block' : 'none';

            // Progress / status / message
            let status = '', message = '', fill = 0;
            if (progressOn) {
                if (startMin === null || endMin === null) {
                    message = startMin === null && endMin === null ? 'Please set start and end times'
                            : startMin === null ? 'Please set start time'
                            : 'Please set end time';
                } else if (endMin <= startMin) {
                    message = 'End time must be after start time';
                } else {
                    const nowMin = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
                    const extra = parseInt(el.extraMinutes.value, 10) || 0;
                    const inExtra = el.extraToggle.checked && extra > 0 && nowMin >= endMin;
                    const finalEnd = inExtra ? endMin + extra : endMin;

                    if (nowMin >= finalEnd) fill = 1;
                    else if (nowMin > startMin) fill = (nowMin - startMin) / (finalEnd - startMin);

                    status = nowMin >= finalEnd ? 'Times Up!'
                           : inExtra ? `Extra Time until ${fmt12(finalEnd)}`
                           : `End Time: ${fmt12(endMin)}`;
                }
            }
            el.fill.style.width = `${fill * 100}%`;
            el.status.textContent = status;
            el.message.textContent = message;

            placeBlock();
        }

        // ---------- Time inputs (End is the anchor) ----------
        // Show End − Start in the Length field when computable; blank it when not (unless the user is driving it).
        function syncLength() {
            if (startMin !== null && endMin !== null && endMin > startMin) el.length.value = endMin - startMin;
            else if (!el.lengthToggle.checked) el.length.value = '';
        }

        function onStart() { startMin = parseTime(el.start.value); syncLength(); render(); }
        function onEnd()   { endMin = parseTime(el.end.value);     syncLength(); render(); }

        function onLength() {
            if (!el.lengthToggle.checked) return;
            const n = parseInt(el.length.value, 10);
            if (n >= 1) {
                if (startMin === null) {
                    const now = new Date();
                    startMin = Math.min(1439, Math.round(now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60));
                    el.start.value = toInputValue(startMin);
                }
                if (startMin + n < 1440) {            // same day only
                    endMin = startMin + n;
                    el.end.value = toInputValue(endMin);
                }
            }
            render();
        }

        ['input', 'change'].forEach(type => {
            el.start.addEventListener(type, onStart);
            el.end.addEventListener(type, onEnd);
            el.length.addEventListener(type, onLength);
            el.extraMinutes.addEventListener(type, render);
        });

        el.lengthToggle.addEventListener('change', () => {
            syncLength();
            render();
            if (el.lengthToggle.checked) el.length.focus();
        });

        el.clear.addEventListener('click', () => {
            startMin = endMin = null;
            el.start.value = el.end.value = el.length.value = '';
            render();
        });

        // ---------- Display toggles ----------
        el.progressToggle.addEventListener('change', render);
        el.extraToggle.addEventListener('change', render);

        // ---------- Positioning & dragging ----------
        function placeBlock() {
            const W = window.innerWidth, H = window.innerHeight;
            const w = el.display.offsetWidth, h = el.display.offsetHeight;
            if (!el.freeToggle.checked) pos.fx = 0.5;
            const x = clamp(pos.fx * W, w / 2, W - w / 2);
            const y = clamp(pos.fy * H, h / 2, H - h / 2);
            pos.fx = x / W; pos.fy = y / H;   // keep stored position inside the viewport
            el.display.style.left = `${x}px`;
            el.display.style.top = `${y}px`;
        }

        el.display.addEventListener('pointerdown', e => {
            if (e.button !== 0) return;
            e.preventDefault();
            const rect = el.display.getBoundingClientRect();
            drag = {
                id: e.pointerId,
                dx: e.clientX - (rect.left + rect.width / 2),
                dy: e.clientY - (rect.top + rect.height / 2),
            };
            el.display.setPointerCapture(e.pointerId);
            document.body.classList.add('dragging');
        });

        el.display.addEventListener('pointermove', e => {
            if (!drag || e.pointerId !== drag.id) return;
            pos.fx = (e.clientX - drag.dx) / window.innerWidth;
            pos.fy = (e.clientY - drag.dy) / window.innerHeight;
            placeBlock();
        });

        function endDrag(e) {
            if (!drag || e.pointerId !== drag.id) return;
            drag = null;
            document.body.classList.remove('dragging');
        }
        el.display.addEventListener('pointerup', endDrag);
        el.display.addEventListener('pointercancel', endDrag);

        function resetPosition() { pos = { fx: 0.5, fy: 0.5 }; placeBlock(); }
        el.display.addEventListener('dblclick', resetPosition);
        el.resetPos.addEventListener('click', resetPosition);
        el.freeToggle.addEventListener('change', placeBlock);   // off → snaps to horizontal center
        window.addEventListener('resize', placeBlock);

        // ---------- Clock size ----------
        function applySize() {
            el.time.style.fontSize = `${el.size.value}px`;
            el.sizeValue.textContent = `${el.size.value}px`;
            placeBlock();                    // re-clamp: a bigger clock may now overflow an edge
        }
        el.size.addEventListener('input', applySize);
        el.resetSize.addEventListener('click', () => { el.size.value = DEFAULT_SIZE; applySize(); });

        // ---------- Menu visibility ----------
        const MENU_ZONE = 100;     // px from top that reveals the menu
        const HIDE_DELAY = 3000;

        function showMenu() {
            menu.visible = true;
            menu.lastActive = Date.now();
            el.menu.classList.add('visible');
        }
        function hideMenu() {
            menu.visible = false;
            el.menu.classList.remove('visible');
        }
        function menuShouldStay() {
            return menu.hovered
                || menuInputs.includes(document.activeElement)
                || Date.now() - menu.lastTyped < HIDE_DELAY;
        }

        document.addEventListener('mousemove', e => {
            if (!drag && e.clientY < MENU_ZONE) showMenu();
        });
        document.addEventListener('pointerdown', e => {   // tap at the top on touch screens
            if (e.pointerType !== 'mouse' && !el.display.contains(e.target) && e.clientY < MENU_ZONE) showMenu();
        });
        el.menu.addEventListener('pointerenter', () => { menu.hovered = true; });
        el.menu.addEventListener('pointerleave', () => { menu.hovered = false; menu.lastActive = Date.now(); });
        menuInputs.forEach(input => {
            input.addEventListener('input', () => { menu.lastTyped = Date.now(); });
            input.addEventListener('keydown', () => { menu.lastTyped = Date.now(); });
        });

        // Poll: hide once nothing has kept the menu open for HIDE_DELAY
        setInterval(() => {
            if (!menu.visible || drag) return;
            if (menuShouldStay()) menu.lastActive = Date.now();
            else if (Date.now() - menu.lastActive >= HIDE_DELAY) hideMenu();
        }, 200);

        document.addEventListener('keydown', e => {
            if (e.key !== 'Escape') return;
            if (el.menu.contains(document.activeElement)) document.activeElement.blur();
            menu.hovered = false;
            menu.lastTyped = 0;
            hideMenu();
        });

        // ---------- Tick (aligned to the second) ----------
        function tick() {
            render();
            setTimeout(tick, 1000 - (Date.now() % 1000) + 10);
        }
        el.size.value = DEFAULT_SIZE;        // fresh start on every load (ignore browser form restore)
        applySize();
        tick();
    })();
    </script>
</body>
</html>
