<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Dinner Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #fff8ee;
    --cream-deep: #fbeedd;
    --card: #ffffff;
    --ink: #4a3728;
    --ink-soft: #7a6a5c;
    --terracotta: #e8734a;
    --terracotta-deep: #cf5c35;
    --sage: #6f9a72;
    --sage-soft: #e8f2e6;
    --gold: #f2b134;
    --border: #f0e0cd;
    --shadow: 0 4px 14px rgba(120, 80, 40, 0.10);
    --shadow-strong: 0 8px 24px rgba(120, 80, 40, 0.18);
    --radius: 16px;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    background: var(--cream);
    background-image:
      radial-gradient(circle at 10% 5%, var(--cream-deep) 0%, transparent 45%),
      radial-gradient(circle at 90% 0%, #fdf1e6 0%, transparent 40%);
    color: var(--ink);
    font-family: 'Nunito', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 60px;
  }

  h1, h2, .day-label, .meal-name{
    font-family: 'Fredoka', system-ui, sans-serif;
  }

  .app-header{
    text-align: center;
    padding: 36px 20px 20px;
  }

  .app-header h1{
    margin: 0;
    font-size: 2.1rem;
    font-weight: 700;
    color: var(--terracotta-deep);
    letter-spacing: 0.3px;
  }

  main{
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* ---------- Menu toolbar ---------- */
  .menu-toolbar{
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 22px;
  }

  button{
    font-family: 'Nunito', sans-serif;
    cursor: pointer;
    border: none;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.92rem;
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease;
  }

  button:active{ transform: translateY(1px) scale(0.98); }

  .btn-primary{
    background: var(--terracotta);
    color: white;
    padding: 12px 22px;
    box-shadow: var(--shadow);
  }
  .btn-primary:hover{ background: var(--terracotta-deep); box-shadow: var(--shadow-strong); }

  .btn-secondary{
    background: var(--card);
    color: var(--ink);
    padding: 12px 20px;
    border: 2px solid var(--border);
  }
  .btn-secondary:hover{ border-color: var(--terracotta); color: var(--terracotta-deep); }

  /* ---------- Menu grid ---------- */
  .menu-grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
    gap: 16px;
    margin-bottom: 44px;
  }

  .day-card{
    background: var(--card);
    border-radius: var(--radius);
    padding: 14px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 10px;
    border: 2px solid transparent;
    transition: border-color 0.15s ease, transform 0.1s ease;
    min-height: 190px;
  }

  .day-card.drag-over{
    border-color: var(--gold);
    transform: translateY(-2px);
  }

  .day-card.dragging{ opacity: 0.5; }

  .day-card.locked{
    background: linear-gradient(180deg, #fff, var(--sage-soft) 220%);
  }

  .day-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .day-label{
    font-weight: 600;
    font-size: 1.05rem;
    color: var(--terracotta-deep);
  }

  .lock-toggle{
    background: none;
    padding: 4px 8px;
    font-size: 1.05rem;
    border-radius: 8px;
  }
  .lock-toggle:hover{ background: var(--cream-deep); }

  .meal-chip{
    background: var(--cream);
    border-radius: 12px;
    padding: 10px 12px;
    flex: 1;
    cursor: grab;
    border: 1px dashed var(--border);
  }
  .meal-chip:active{ cursor: grabbing; }
  .meal-chip.flex{
    background: repeating-linear-gradient(45deg, #fff, #fff 8px, var(--cream-deep) 8px, var(--cream-deep) 16px);
    font-style: italic;
  }

  .meal-name{
    font-weight: 600;
    font-size: 0.98rem;
    line-height: 1.25;
  }

  .meal-notes{
    margin-top: 6px;
    font-size: 0.8rem;
    color: var(--ink-soft);
    line-height: 1.3;
  }

  .meal-select{
    width: 100%;
    padding: 8px 10px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: white;
    color: var(--ink);
    font-family: 'Nunito', sans-serif;
    font-size: 0.85rem;
  }
  .meal-select:focus{ outline: none; border-color: var(--terracotta); }

  .locked-hint{
    font-size: 0.78rem;
    color: var(--sage);
    text-align: center;
    font-weight: 700;
  }

  .print-only-name{ display: none; }
  .print-only-ingredients{ display: none; }

  /* ---------- Ingredient list ---------- */
  .ingredient-list-section{
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px 24px;
    box-shadow: var(--shadow);
    margin-bottom: 44px;
  }
  .ingredient-list-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }
  .ingredient-list-section h3{
    margin: 0;
    color: var(--terracotta-deep);
    font-family: 'Fredoka', sans-serif;
    font-size: 1.15rem;
  }
  .ing-view-toggle{
    background: transparent;
    color: var(--terracotta-deep);
    border: 2px solid var(--border);
    padding: 6px 12px;
    font-size: 0.78rem;
  }
  .ing-view-toggle:hover{ border-color: var(--terracotta); background: var(--cream); }
  .ingredient-list{
    list-style: none;
    margin: 0;
    padding: 0;
    columns: 2;
    column-gap: 24px;
  }
  .ingredient-list > li{
    font-size: 0.92rem;
    padding: 5px 0;
    border-bottom: 1px dashed var(--border);
    break-inside: avoid;
  }
  @media (min-width: 700px){
    .ingredient-list:not(.grouped){ columns: 3; }
  }
  .ingredient-list.grouped{ columns: 1; }
  .ingredient-list.grouped > li{ border-bottom: none; padding: 0; margin-bottom: 12px; }
  .ingredient-group-heading{
    font-weight: 700;
    color: var(--ink);
    font-size: 0.9rem;
    margin-bottom: 4px;
  }
  .ingredient-sublist{
    list-style: disc;
    margin: 0;
    padding-left: 20px;
  }
  .ingredient-sublist li{
    font-size: 0.88rem;
    padding: 2px 0;
  }
  .ingredient-list-empty{
    columns: 1;
    color: var(--ink-soft);
    font-style: italic;
    border-bottom: none !important;
  }

  /* ---------- Meal database ---------- */
  .db-section{
    background: var(--card);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
  }

  .db-section h2{
    margin: 0 0 4px;
    color: var(--terracotta-deep);
    font-size: 1.35rem;
  }

  .db-toolbar{
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
    align-items: center;
  }

  .db-toolbar input[type="text"]{
    padding: 10px 14px;
    border-radius: 10px;
    border: 2px solid var(--border);
    font-family: 'Nunito', sans-serif;
    font-size: 0.9rem;
    flex: 1 1 160px;
  }
  .db-toolbar input[type="text"]:focus{ outline: none; border-color: var(--terracotta); }
  .db-toolbar input.emoji-input{ flex: 0 1 70px; text-align: center; }

  .import-label{
    background: var(--card);
    color: var(--ink);
    padding: 12px 20px;
    border: 2px solid var(--border);
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.92rem;
    cursor: pointer;
    display: inline-block;
  }
  .import-label:hover{ border-color: var(--terracotta); color: var(--terracotta-deep); }

  .meal-list{
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .meal-row{
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--cream);
    border-radius: 10px;
    padding: 10px 12px;
    border: 1px solid var(--border);
  }
  .meal-row.dragging{ opacity: 0.4; }
  .meal-row.drag-over{ border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) inset; }
  .meal-row.tradition{ background: var(--sage-soft); }

  .drag-handle{
    cursor: grab;
    color: var(--ink-soft);
    font-size: 1.1rem;
    user-select: none;
  }

  .meal-info{ flex: 1; min-width: 0; }
  .meal-row-name{ font-weight: 700; font-size: 0.95rem; }
  .meal-row-notes{ font-size: 0.8rem; color: var(--ink-soft); margin-top: 2px; }

  .meal-row.editing{ border-color: var(--terracotta); background: #fff; }
  .meal-row.editing .drag-handle{ opacity: 0.3; pointer-events: none; }

  .meal-edit{
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .edit-input{
    width: 100%;
    padding: 7px 10px;
    border-radius: 8px;
    border: 2px solid var(--border);
    font-family: 'Nunito', sans-serif;
    font-size: 0.85rem;
    background: white;
    color: var(--ink);
  }
  .edit-input:focus{ outline: none; border-color: var(--terracotta); }

  .edit-row{ display: flex; gap: 6px; }
  .edit-row .edit-name{ flex: 1; min-width: 0; }
  .edit-emoji{ flex: 0 0 60px; text-align: center; }

  .meal-actions{
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .tradition-badge{
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--sage);
    white-space: nowrap;
  }

  .edit-btn{
    background: transparent;
    color: var(--terracotta-deep);
    border: 2px solid var(--border);
    padding: 7px 12px;
    font-size: 0.8rem;
    white-space: nowrap;
  }
  .edit-btn:hover{ border-color: var(--terracotta); background: var(--cream); }

  .save-btn{
    background: var(--sage);
    color: white;
    padding: 7px 14px;
    font-size: 0.8rem;
  }
  .save-btn:hover{ background: #5c8a5f; }

  .cancel-btn{
    background: transparent;
    color: var(--ink-soft);
    border: 2px solid var(--border);
    padding: 7px 14px;
    font-size: 0.8rem;
  }
  .cancel-btn:hover{ background: var(--cream-deep); }

  .delete-btn{
    background: transparent;
    color: #b5533a;
    border: 2px solid #f0c9bb;
    padding: 7px 14px;
    font-size: 0.8rem;
    white-space: nowrap;
  }
  .delete-btn:hover{ background: #fdeeea; }
  .delete-btn.confirming{
    background: #d9463c;
    color: white;
    border-color: #d9463c;
  }

  /* ---------- Toast ---------- */
  .toast{
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    background: var(--ink);
    color: white;
    padding: 12px 22px;
    border-radius: 999px;
    font-size: 0.9rem;
    font-weight: 600;
    box-shadow: var(--shadow-strong);
    z-index: 100;
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
  }
  .toast.show{ opacity: 1; }

  footer{
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.8rem;
    margin-top: 40px;
  }

  /* ---------- Print ---------- */
  @media print{
    body{ background: white; padding: 0; }
    .menu-toolbar, .db-section, .toast, footer, .app-header,
    .lock-toggle, .meal-select, .locked-hint, .meal-notes, .ing-view-toggle { display: none !important; }
    main{ max-width: 100%; padding: 0; }
    .menu-grid{
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-bottom: 0;
    }
    .day-card{
      box-shadow: none;
      border: 1px solid #ccc;
      break-inside: avoid;
      min-height: 0;
      padding: 6px 5px;
      gap: 3px;
    }
    .day-label{ font-size: 0.72rem; }
    .print-only-name{
      display: block;
      font-weight: 700;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.68rem;
      line-height: 1.15;
    }
    .print-only-ingredients{
      display: block;
      margin: 3px 0 0;
      padding-left: 12px;
      font-size: 0.58rem;
      line-height: 1.25;
      color: #333;
    }
    .print-only-ingredients li{ margin-bottom: 0; }
    .meal-chip{ display: none; }
    .ingredient-list-section{
      box-shadow: none;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 8px 10px;
      margin: 8px 0 0;
    }
    .ingredient-list-header{ margin-bottom: 6px; }
    .ingredient-list-section h3{ font-size: 0.85rem; }
    .ingredient-list:not(.grouped){ columns: 3; column-gap: 14px; }
    .ingredient-list > li{ font-size: 0.72rem; padding: 2px 0; border-bottom: none; }
    .ingredient-list.grouped{ columns: 2; column-gap: 14px; }
    .ingredient-list.grouped > li{ margin-bottom: 6px; }
    .ingredient-group-heading{ font-size: 0.72rem; }
    .ingredient-sublist li{ font-size: 0.66rem; padding: 1px 0; }
  }
</style>
</head>
<body>

<header class="app-header">
  <h1>🍽️ Family Dinner Planner</h1>
</header>

<main>
  <section id="menuSection">
    <div class="menu-toolbar">
      <button id="randomizeBtn" class="btn-primary" type="button">🎲 Randomize</button>
      <button id="unlockAllBtn" class="btn-secondary" type="button">🔓 Unlock All</button>
      <button id="copyBtn" class="btn-secondary" type="button">📋 Copy Menu</button>
      <button id="printBtn" class="btn-secondary" type="button">🖨️ Print Menu</button>
      <button id="toggleIngredientListBtn" class="btn-secondary" type="button">🛒 Show Ingredient List</button>
    </div>
    <div id="menuGrid" class="menu-grid"></div>
    <div id="ingredientListSection" class="ingredient-list-section" hidden>
      <div class="ingredient-list-header">
        <h3>🛒 Ingredient List</h3>
        <button id="ingredientViewToggle" class="ing-view-toggle" type="button">Group by meal</button>
      </div>
      <ul id="ingredientList" class="ingredient-list"></ul>
    </div>
  </section>

  <section id="dbSection" class="db-section">
    <h2>Meal Database</h2>
    <div class="db-toolbar">
      <input type="text" id="newMealEmoji" class="emoji-input" placeholder="Emoji">
      <input type="text" id="newMealName" placeholder="New meal name">
      <input type="text" id="newMealNotes" placeholder="Notes (optional — e.g. hidden veggie trick)">
      <input type="text" id="newMealIngredients" placeholder="Ingredients, comma-separated (optional)">
      <button id="addMealBtn" class="btn-primary" type="button">+ Add Meal</button>
      <button id="exportBtn" class="btn-secondary" type="button">⬇️ Export meals.json</button>
      <label class="import-label">⬆️ Import &amp; Merge
        <input type="file" id="importInput" accept="application/json,.json" hidden>
      </label>
    </div>
    <ul id="mealList" class="meal-list"></ul>
  </section>
</main>

<footer>Made with ❤️ for weeknight dinners.</footer>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
  "use strict";

  const LS_INGREDIENT_VIEW = 'dinnerPlanner.ingredientView';

    { id:'trad-thu-quesadillas', name:'Quesadillas & Smoothies', notes:"Cheese quesadillas with a fruit-and-spinach smoothie.", tradition:'thu', emoji:'🫓🥤', ingredients:['Flour tortillas', 'Shredded cheese', 'Frozen mixed berries', 'Fresh spinach', 'Milk or yogurt', 'Banana'] },

    { id:'bbq-chicken', name:'BBQ Chicken & Corn', notes:'A reliable crowd-pleaser for both kids.', ingredients:['Chicken thighs or breasts', 'BBQ sauce', 'Corn on the cob', 'Butter'] },
    { id:'korean-beef-bowls', name:'Korean Beef Bowls', notes:'Mild spice — easy to dial down or up.', ingredients:['Ground beef', 'Soy sauce', 'Brown sugar', 'Garlic', 'Ginger', 'Sesame oil', 'Rice', 'Green onion'] },
    { id:'sloppy-joes', name:'Sloppy Joes', notes:'Grated carrot cooks right into the sauce.', ingredients:['Ground beef', 'Carrot (grated)', 'Onion', 'Ketchup', 'Worcestershire sauce', 'Brown sugar', 'Hamburger buns'] },

    { id:'mild-curry', name:'Mild Chicken Curry & Rice', notes:'Coconut milk keeps the curry mild and creamy.', ingredients:['Chicken breast', 'Coconut milk', 'Mild curry powder', 'Onion', 'Garlic', 'Rice'] },
    { id:'lo-mein', name:'Veggie Lo Mein', notes:'Stir-fried noodles with carrot, cabbage, and bell pepper.', ingredients:['Lo mein noodles', 'Carrot', 'Cabbage', 'Bell pepper', 'Soy sauce', 'Garlic', 'Sesame oil'] },
    { id:'pulled-pork-sliders', name:'Pulled Pork Sliders', notes:'Serve coleslaw on the side, or blend it into the sauce.', ingredients:['Pork shoulder', 'BBQ sauce', 'Slider buns', 'Coleslaw mix', 'Coleslaw dressing'] },
    { id:'orange-chicken', name:'Orange Chicken & Rice', notes:'Sweet orange sauce over crispy chicken.', ingredients:['Chicken breast', 'Cornstarch', 'Orange juice', 'Soy sauce', 'Brown sugar', 'Garlic', 'Rice'] },
    { id:'fajitas', name:'Sheet-Pan Chicken Fajitas', notes:'Let everyone build their own — cut peppers extra small.', ingredients:['Chicken breast', 'Bell peppers', 'Onion', 'Fajita seasoning', 'Flour tortillas', 'Sour cream', 'Shredded cheese'] }
  ];

  let state = { meals: [], menu: {}, locks: { thu:true, fri:true }, showIngredientList: false, ingredientView: 'combined' };
  const confirmTimers = new WeakMap();
  const editingIds = new Set();

  // ---------- persistence ----------
  function persistMeals(){ try{ localStorage.setItem(LS_MEALS, JSON.stringify(state.meals)); }catch(e){} }
  function persistMenu(){ try{ localStorage.setItem(LS_MENU, JSON.stringify(state.menu)); }catch(e){} }
  function persistLocks(){ try{ localStorage.setItem(LS_LOCKS, JSON.stringify(state.locks)); }catch(e){} }
  function persistShowIngredientList(){ try{ localStorage.setItem(LS_SHOW_INGREDIENTS, state.showIngredientList ? '1' : '0'); }catch(e){} }
  function persistIngredientView(){ try{ localStorage.setItem(LS_INGREDIENT_VIEW, state.ingredientView); }catch(e){} }

  async function loadMeals(){
    try{
      const res = await fetch('./meals.json', { cache:'no-store' });
      if(res.ok){
        const data = await res.json();
        if(Array.isArray(data) && data.length){
          return data;
        }
      }
    }catch(err){ /* fetch unavailable (e.g. opened as a local file) — fall back */ }
    try{
      const stored = localStorage.getItem(LS_MEALS);
      if(stored){
        const parsed = JSON.parse(stored);
        if(Array.isArray(parsed) && parsed.length) return parsed;
      }
    }catch(err){ /* ignore corrupt storage */ }
    return JSON.parse(JSON.stringify(DEFAULT_MEALS));
  }

  function loadMenuAndLocks(){
    let menu = null, locks = null;
    try{ const m = localStorage.getItem(LS_MENU); if(m) menu = JSON.parse(m); }catch(e){}
    try{ const l = localStorage.getItem(LS_LOCKS); if(l) locks = JSON.parse(l); }catch(e){}
    return { menu, locks };
  }

  function loadShowIngredientList(){
    try{ return localStorage.getItem(LS_SHOW_INGREDIENTS) === '1'; }catch(e){ return false; }
  }

  function loadIngredientView(){
    try{ return localStorage.getItem(LS_INGREDIENT_VIEW) === 'grouped' ? 'grouped' : 'combined'; }catch(e){ return 'combined'; }
  }

  // ---------- helpers ----------
  function mealById(id){ return state.meals.find(m => m.id === id); }
  function traditionMealFor(day){ return state.meals.find(m => m.tradition === day); }
  function mealDisplayName(meal){ return meal ? ((meal.emoji ? meal.emoji + ' ' : '') + meal.name) : ''; }
  function mealIngredients(meal){ return (meal && Array.isArray(meal.ingredients)) ? meal.ingredients : []; }
  function parseIngredientsText(text){
    return (text || '')
      .split(',')
      .map(s => s.trim())
      .filter(Boolean);
  }

  function isLockedDay(day){ return !!state.locks[day]; }
  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ---------- core actions ----------
  function randomize(){
    // Anything sitting on a locked day is "already on the menu" and must not
    // be handed to another day — this includes Flexible Night itself.
    const reserved = new Set();
    DAYS.forEach(day => {
      if(state.locks[day]) reserved.add(state.menu[day]);
    });
    const hasLockedFlex = reserved.has(FLEX);

    const availablePool = shuffle(state.meals.filter(m => !m.tradition && !reserved.has(m.id)));

    const unlockedRegular = REGULAR_DAYS.filter(d => !state.locks[d]);
    // Only introduce a new Flexible Night if one isn't already locked in somewhere.
    const flexDay = (!hasLockedFlex && unlockedRegular.length)
      ? unlockedRegular[Math.floor(Math.random() * unlockedRegular.length)]
      : null;

    // Every day that needs a freshly randomized real meal this round, drawn
    // from one shared shuffled pool so none of them double up on each other.
    const daysNeedingMeal = [
      ...unlockedRegular.filter(d => d !== flexDay),
      ...TRADITION_DAYS.filter(d => !state.locks[d])
    ];
    daysNeedingMeal.forEach((day, i) => {
      state.menu[day] = availablePool.length ? availablePool[i % availablePool.length].id : FLEX;
    });

    if(flexDay) state.menu[flexDay] = FLEX;

    TRADITION_DAYS.forEach(day => {
      if(state.locks[day]){
        const t = traditionMealFor(day);
        state.menu[day] = t ? t.id : FLEX;
      }
    });

    persistMenu();
    renderMenu();
    showToast('Week randomized!');
  }

  function toggleLock(day){
    state.locks[day] = !state.locks[day];
    if(state.locks[day] && TRADITION_DAYS.includes(day)){
      const t = traditionMealFor(day);
      state.menu[day] = t ? t.id : FLEX;
    }
    persistLocks();
    persistMenu();
    renderMenu();
  }

  function unlockAll(){
    REGULAR_DAYS.forEach(day => { state.locks[day] = false; });
    persistLocks();
    renderMenu();
    showToast('Unlocked every night except Thursday & Friday.');
  }

  function toggleIngredientList(){
    state.showIngredientList = !state.showIngredientList;
    persistShowIngredientList();
    renderIngredientList();
  }

  function toggleIngredientView(){
    state.ingredientView = state.ingredientView === 'grouped' ? 'combined' : 'grouped';
    persistIngredientView();
    renderIngredientList();
  }

  function setDayMeal(day, value){
    if(isLockedDay(day)) return;
    state.menu[day] = value;
    persistMenu();
    renderMenu();
  }

  function swapDays(dayA, dayB){
    if(!dayA || dayA === dayB) return;
    const tmpMeal = state.menu[dayA];
    state.menu[dayA] = state.menu[dayB];
    state.menu[dayB] = tmpMeal;

    // The lock follows the meal, not the calendar day it lands on.
    const tmpLock = state.locks[dayA];
    state.locks[dayA] = state.locks[dayB];
    state.locks[dayB] = tmpLock;

    persistMenu();
    persistLocks();
    renderMenu();
  }

  function addMeal(name, notes, ingredientsText, emoji){
    name = (name || '').trim();
    if(!name) return;
    const id = 'm-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
    state.meals.push({ id, name, notes: (notes || '').trim(), emoji: (emoji || '').trim(), ingredients: parseIngredientsText(ingredientsText) });
    persistMeals();
    renderDatabase();
    renderMenu();
  }

  function removeMeal(id){
    const m = mealById(id);
    if(!m || m.tradition) return;
    state.meals = state.meals.filter(x => x.id !== id);
    DAYS.forEach(day => { if(state.menu[day] === id) state.menu[day] = FLEX; });
    persistMeals();
    persistMenu();
    renderDatabase();
    renderMenu();
  }

  function saveMealEdit(id, name, notes, ingredientsText, emoji){
    name = (name || '').trim();
    if(!name){ showToast('Meal name cannot be empty.'); return; }
    const m = mealById(id);
    if(!m) return;
    m.name = name;
    m.notes = (notes || '').trim();
    m.emoji = (emoji || '').trim();
    m.ingredients = parseIngredientsText(ingredientsText);
    editingIds.delete(id);
    persistMeals();
    renderDatabase();
    renderMenu();
    showToast('Meal updated.');
  }

  function reorderMeals(fromIndex, toIndex){
    if(fromIndex === toIndex || fromIndex < 0 || fromIndex >= state.meals.length) return;
    const arr = state.meals;
    const [item] = arr.splice(fromIndex, 1);
    arr.splice(toIndex, 0, item);
    persistMeals();
    renderDatabase();
    renderMenu();
  }

  function exportMeals(){
    const data = JSON.stringify(state.meals, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'meals.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('meals.json exported — commit it to update GitHub Pages.');
  }

  function importMealsFromFile(file){
    const reader = new FileReader();
    reader.onload = (e) => {
      try{
        const imported = JSON.parse(e.target.result);
        if(!Array.isArray(imported)) throw new Error('not an array');
        let added = 0;
        imported.forEach(m => {
          if(!m || typeof m.name !== 'string' || !m.name.trim()) return;
          const nameKey = m.name.trim().toLowerCase();
          const exists = state.meals.some(existing =>
            (m.id && existing.id === m.id) || existing.name.trim().toLowerCase() === nameKey
          );
          if(!exists){
            state.meals.push({
              id: (m.id && typeof m.id === 'string') ? m.id : ('m-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7)),
              name: m.name.trim(),
              notes: typeof m.notes === 'string' ? m.notes.trim() : '',
              emoji: typeof m.emoji === 'string' ? m.emoji.trim() : '',
              ingredients: Array.isArray(m.ingredients) ? m.ingredients.filter(i => typeof i === 'string' && i.trim()).map(i => i.trim()) : []
              // tradition flags are never imported — those two slots stay protected
            });
            added++;
          }
        });
        persistMeals();
        renderDatabase();
        renderMenu();
        showToast(added ? `Imported ${added} new meal${added === 1 ? '' : 's'}.` : 'No new meals found to import.');
      }catch(err){
        showToast('Import failed — please choose a valid meals.json file.');
      }
    };
    reader.readAsText(file);
  }

  function buildMenuText(){
    const lines = ['🍽️ Weekly Dinner Menu', ''];
    DAYS.forEach(day => {
      const id = state.menu[day];
      let text;
      if(id === FLEX) text = 'Flexible night (eating out / leftovers)';
      else { const m = mealById(id); text = m ? mealDisplayName(m) : '—'; }
      lines.push(`${DAY_LABELS[day]}: ${text}`);
    });
    return lines.join('\n');
  }

  function fallbackCopy(text){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try{
      document.execCommand('copy');
      showToast('Menu copied to clipboard!');
    }catch(e){
      showToast('Could not copy automatically — please copy manually.');
    }
    document.body.removeChild(ta);
  }

  function copyMenu(){
    const text = buildMenuText();
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(
        () => showToast('Menu copied to clipboard!'),
        () => fallbackCopy(text)
      );
    } else {
      fallbackCopy(text);
    }
  }

  let toastTimer = null;
  function showToast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.hidden = false;
    requestAnimationFrame(() => el.classList.add('show'));
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      el.classList.remove('show');
      setTimeout(() => { el.hidden = true; }, 260);
    }, 2600);
  }

  // ---------- rendering ----------
  function renderMenu(){
    const grid = document.getElementById('menuGrid');
    grid.innerHTML = '';

    DAYS.forEach(day => {
      const locked = isLockedDay(day);
      const card = document.createElement('div');
      card.className = 'day-card' + (locked ? ' locked' : '');
      card.dataset.day = day;

      const header = document.createElement('div');
      header.className = 'day-header';
      const label = document.createElement('span');
      label.className = 'day-label';
      label.textContent = DAY_LABELS[day];
      header.appendChild(label);

      const lockBtn = document.createElement('button');
      lockBtn.type = 'button';
      lockBtn.className = 'lock-toggle';
      lockBtn.title = locked ? 'Unlock this night' : (TRADITION_DAYS.includes(day) ? 'Lock to tradition' : 'Lock this night');
      lockBtn.textContent = locked ? '🔒' : '🔓';
      lockBtn.addEventListener('click', () => toggleLock(day));
      header.appendChild(lockBtn);
      card.appendChild(header);

      const mealId = state.menu[day];
      const meal = mealId === FLEX ? null : mealById(mealId);

      const chip = document.createElement('div');
      chip.className = 'meal-chip' + (mealId === FLEX ? ' flex' : '');
      chip.draggable = true;
      chip.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', day);
        card.classList.add('dragging');
      });
      chip.addEventListener('dragend', () => card.classList.remove('dragging'));

      const nameEl = document.createElement('div');
      nameEl.className = 'meal-name';
      nameEl.textContent = mealId === FLEX ? '🍽️ Flexible Night' : (meal ? mealDisplayName(meal) : '— Select a meal —');
      chip.appendChild(nameEl);

      const noteText = mealId === FLEX ? 'Eating out, leftovers, or whatever sounds good.' : (meal && meal.notes ? meal.notes : '');
      if(noteText){
        const notesEl = document.createElement('div');
        notesEl.className = 'meal-notes';
        notesEl.textContent = noteText;
        chip.appendChild(notesEl);
      }
      card.appendChild(chip);

      const printOnly = document.createElement('div');
      printOnly.className = 'print-only-name';
      printOnly.textContent = nameEl.textContent;
      card.appendChild(printOnly);

      const printIngredients = document.createElement('ul');
      printIngredients.className = 'print-only-ingredients';
      mealIngredients(meal).forEach(ing => {
        const ingLi = document.createElement('li');
        ingLi.textContent = ing;
        printIngredients.appendChild(ingLi);
      });
      card.appendChild(printIngredients);

      if(locked){
        const hint = document.createElement('div');
        hint.className = 'locked-hint';
        hint.textContent = TRADITION_DAYS.includes(day) ? 'Locked to tradition — unlock to change' : 'Locked — unlock to change';
        card.appendChild(hint);
      } else {
        const select = document.createElement('select');
        select.className = 'meal-select';
        const flexOpt = document.createElement('option');
        flexOpt.value = FLEX;
        flexOpt.textContent = '🍽️ Flexible Night';
        select.appendChild(flexOpt);
        state.meals.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = mealDisplayName(m);
          select.appendChild(opt);
        });
        select.value = mealId;
        select.addEventListener('change', (e) => setDayMeal(day, e.target.value));
        card.appendChild(select);
      }

      // Drag-and-drop swapping works regardless of lock state — locking only
      // protects a day from the dropdown and from Randomize.
      card.addEventListener('dragover', (e) => { e.preventDefault(); card.classList.add('drag-over'); });
      card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
      card.addEventListener('drop', (e) => {
        e.preventDefault();
        card.classList.remove('drag-over');
        const fromDay = e.dataTransfer.getData('text/plain');
        swapDays(fromDay, day);
      });

      grid.appendChild(card);
    });

    renderIngredientList();
  }

  function renderIngredientList(){
    const btn = document.getElementById('toggleIngredientListBtn');
    if(btn) btn.textContent = state.showIngredientList ? '🛒 Hide Ingredient List' : '🛒 Show Ingredient List';

    const viewBtn = document.getElementById('ingredientViewToggle');
    if(viewBtn) viewBtn.textContent = state.ingredientView === 'grouped' ? 'Combined list' : 'Group by meal';

    const section = document.getElementById('ingredientListSection');
    const list = document.getElementById('ingredientList');
    list.innerHTML = '';
    list.className = 'ingredient-list' + (state.ingredientView === 'grouped' ? ' grouped' : '');

    if(!state.showIngredientList){
      section.hidden = true;
      return;
    }

    section.hidden = false;

    // Every day with a real (non-Flex) meal that has ingredients listed.
    const dayMeals = DAYS.map(day => {
      const mealId = state.menu[day];
      if(mealId === FLEX) return null;
      const meal = mealById(mealId);
      const ings = mealIngredients(meal);
      if(!meal || !ings.length) return null;
      return { day, meal, ings };
    }).filter(Boolean);

    if(!dayMeals.length){
      const emptyLi = document.createElement('li');
      emptyLi.className = 'ingredient-list-empty';
      emptyLi.textContent = "No ingredients to show for this week's menu yet — try Randomize, or check that each day has a meal with ingredients listed.";
      list.appendChild(emptyLi);
      return;
    }

    if(state.ingredientView === 'grouped'){
      dayMeals.forEach(({ day, meal, ings }) => {
        const groupLi = document.createElement('li');
        groupLi.className = 'ingredient-group';

        const heading = document.createElement('div');
        heading.className = 'ingredient-group-heading';
        heading.textContent = `${DAY_LABELS[day]} — ${mealDisplayName(meal)}`;
        groupLi.appendChild(heading);

        const subList = document.createElement('ul');
        subList.className = 'ingredient-sublist';
        ings.forEach(ing => {
          const item = document.createElement('li');
          item.textContent = ing;
          subList.appendChild(item);
        });
        groupLi.appendChild(subList);

        list.appendChild(groupLi);
      });
    } else {
      const counts = new Map();
      dayMeals.forEach(({ ings }) => {
        ings.forEach(ing => {
          const trimmed = (ing || '').trim();
          if(!trimmed) return;
          const key = trimmed.toLowerCase();
          if(counts.has(key)) counts.get(key).count++;
          else counts.set(key, { label: trimmed, count: 1 });
        });
      });

      const items = Array.from(counts.values()).sort((a, b) => a.label.localeCompare(b.label));
      items.forEach(item => {
        const li = document.createElement('li');
        li.textContent = item.count > 1 ? `${item.label} (${item.count} meals)` : item.label;
        list.appendChild(li);
      });
    }
  }

  function renderDatabase(){
    const list = document.getElementById('mealList');
    list.innerHTML = '';

    state.meals.forEach((m, idx) => {
      const li = document.createElement('li');
      const editing = editingIds.has(m.id);
      li.className = 'meal-row' + (m.tradition ? ' tradition' : '') + (editing ? ' editing' : '');
      li.draggable = !editing;
      li.dataset.index = String(idx);

      if(!editing){
        li.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/plain', String(idx));
          li.classList.add('dragging');
        });
        li.addEventListener('dragend', () => li.classList.remove('dragging'));
        li.addEventListener('dragover', (e) => { e.preventDefault(); li.classList.add('drag-over'); });
        li.addEventListener('dragleave', () => li.classList.remove('drag-over'));
        li.addEventListener('drop', (e) => {
          e.preventDefault();
          li.classList.remove('drag-over');
          const fromIdx = parseInt(e.dataTransfer.getData('text/plain'), 10);
          if(!isNaN(fromIdx)) reorderMeals(fromIdx, idx);
        });
      }

      const handle = document.createElement('span');
      handle.className = 'drag-handle';
      handle.textContent = '⠿';
      li.appendChild(handle);

      if(editing){
        const editWrap = document.createElement('div');
        editWrap.className = 'meal-edit';

        const topRow = document.createElement('div');
        topRow.className = 'edit-row';

        const emojiInput = document.createElement('input');
        emojiInput.type = 'text';
        emojiInput.className = 'edit-input edit-emoji';
        emojiInput.value = m.emoji || '';
        emojiInput.placeholder = '😀';
        topRow.appendChild(emojiInput);

        const nameInput = document.createElement('input');
        nameInput.type = 'text';
        nameInput.className = 'edit-input edit-name';
        nameInput.value = m.name;
        nameInput.placeholder = 'Meal name';
        topRow.appendChild(nameInput);

        editWrap.appendChild(topRow);

        const notesInput = document.createElement('input');
        notesInput.type = 'text';
        notesInput.className = 'edit-input edit-notes';
        notesInput.value = m.notes || '';
        notesInput.placeholder = 'Notes (optional)';
        editWrap.appendChild(notesInput);

        const ingredientsInput = document.createElement('input');
        ingredientsInput.type = 'text';
        ingredientsInput.className = 'edit-input edit-ingredients';
        ingredientsInput.value = mealIngredients(m).join(', ');
        ingredientsInput.placeholder = 'Ingredients, comma-separated (optional)';
        editWrap.appendChild(ingredientsInput);

        li.appendChild(editWrap);

        const actions = document.createElement('div');
        actions.className = 'meal-actions';

        const saveBtn = document.createElement('button');
        saveBtn.type = 'button';
        saveBtn.className = 'save-btn';
        saveBtn.textContent = 'Save';
        actions.appendChild(saveBtn);

        const cancelBtn = document.createElement('button');
        cancelBtn.type = 'button';
        cancelBtn.className = 'cancel-btn';
        cancelBtn.textContent = 'Cancel';
        actions.appendChild(cancelBtn);

        li.appendChild(actions);

        saveBtn.addEventListener('click', () => saveMealEdit(m.id, nameInput.value, notesInput.value, ingredientsInput.value, emojiInput.value));
        cancelBtn.addEventListener('click', () => { editingIds.delete(m.id); renderDatabase(); });
        [emojiInput, nameInput, notesInput, ingredientsInput].forEach(inp => {
          inp.addEventListener('keydown', (e) => {
            if(e.key === 'Enter') saveBtn.click();
            if(e.key === 'Escape') cancelBtn.click();
          });
        });
      } else {
        const info = document.createElement('div');
        info.className = 'meal-info';
        const nm = document.createElement('div');
        nm.className = 'meal-row-name';
        nm.textContent = mealDisplayName(m);
        info.appendChild(nm);
        if(m.notes){
          const nt = document.createElement('div');
          nt.className = 'meal-row-notes';
          nt.textContent = m.notes;
          info.appendChild(nt);
        }
        li.appendChild(info);

        const actions = document.createElement('div');
        actions.className = 'meal-actions';

        const editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.className = 'edit-btn';
        editBtn.textContent = '✏️ Edit';
        editBtn.addEventListener('click', () => { editingIds.add(m.id); renderDatabase(); });
        actions.appendChild(editBtn);

        if(m.tradition){
          const badge = document.createElement('span');
          badge.className = 'tradition-badge';
          badge.textContent = '🔒 ' + DAY_LABELS[m.tradition] + ' tradition';
          actions.appendChild(badge);
        } else {
          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'delete-btn';
          delBtn.textContent = 'Remove';
          delBtn.addEventListener('click', () => {
            if(delBtn.classList.contains('confirming')){
              clearTimeout(confirmTimers.get(delBtn));
              confirmTimers.delete(delBtn);
              removeMeal(m.id);
            } else {
              delBtn.classList.add('confirming');
              delBtn.textContent = 'Confirm?';
              const t = setTimeout(() => {
                delBtn.classList.remove('confirming');
                delBtn.textContent = 'Remove';
                confirmTimers.delete(delBtn);
              }, 4000);
              confirmTimers.set(delBtn, t);
            }
          });
          actions.appendChild(delBtn);
        }

        li.appendChild(actions);
      }

      list.appendChild(li);
    });
  }

  // ---------- global controls ----------
  function bindGlobalControls(){
    document.getElementById('randomizeBtn').addEventListener('click', randomize);
    document.getElementById('unlockAllBtn').addEventListener('click', unlockAll);
    document.getElementById('copyBtn').addEventListener('click', copyMenu);
    document.getElementById('printBtn').addEventListener('click', () => window.print());
    document.getElementById('toggleIngredientListBtn').addEventListener('click', toggleIngredientList);
    document.getElementById('ingredientViewToggle').addEventListener('click', toggleIngredientView);

    document.getElementById('addMealBtn').addEventListener('click', () => {
      const emojiInput = document.getElementById('newMealEmoji');
      const nameInput = document.getElementById('newMealName');
      const notesInput = document.getElementById('newMealNotes');
      const ingredientsInput = document.getElementById('newMealIngredients');
      addMeal(nameInput.value, notesInput.value, ingredientsInput.value, emojiInput.value);
      emojiInput.value = '';
      nameInput.value = '';
      notesInput.value = '';
      ingredientsInput.value = '';
      nameInput.focus();
    });
    document.getElementById('newMealName').addEventListener('keydown', (e) => {
      if(e.key === 'Enter') document.getElementById('addMealBtn').click();
    });

    document.getElementById('exportBtn').addEventListener('click', exportMeals);
    document.getElementById('importInput').addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if(file) importMealsFromFile(file);
      e.target.value = '';
    });

    // click elsewhere cancels a pending delete confirmation
    document.addEventListener('click', (e) => {
      document.querySelectorAll('.delete-btn.confirming').forEach(btn => {
        if(btn !== e.target){
          btn.classList.remove('confirming');
          btn.textContent = 'Remove';
          const t = confirmTimers.get(btn);
          if(t) clearTimeout(t);
          confirmTimers.delete(btn);
        }
      });
    });
  }

  // ---------- init ----------
  async function init(){
    state.meals = await loadMeals();
    persistMeals();
    state.showIngredientList = loadShowIngredientList();
    state.ingredientView = loadIngredientView();

    const defaultLocks = { fri:true, sat:false, sun:false, mon:false, tue:false, wed:false, thu:true };
    const { menu, locks } = loadMenuAndLocks();
    if(menu && locks && DAYS.every(d => d in menu)){
      state.menu = menu;
      state.locks = Object.assign({}, defaultLocks, locks);
    } else {
      state.locks = Object.assign({}, defaultLocks);
      state.menu = {};
      DAYS.forEach(d => { state.menu[d] = ''; });
      const tFri = traditionMealFor('fri');
      const tThu = traditionMealFor('thu');
      state.menu.fri = tFri ? tFri.id : FLEX;
      state.menu.thu = tThu ? tThu.id : FLEX;
      randomize();
    }

    renderMenu();
    renderDatabase();
    bindGlobalControls();
  }

  init();
})();
</script>
</body>
</html>
