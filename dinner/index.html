<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Dinner Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #fff8ee;
    --cream-deep: #fbeedd;
    --card: #ffffff;
    --ink: #4a3728;
    --ink-soft: #7a6a5c;
    --terracotta: #e8734a;
    --terracotta-deep: #cf5c35;
    --sage: #6f9a72;
    --sage-soft: #e8f2e6;
    --gold: #f2b134;
    --border: #f0e0cd;
    --shadow: 0 4px 14px rgba(120, 80, 40, 0.10);
    --shadow-strong: 0 8px 24px rgba(120, 80, 40, 0.18);
    --radius: 16px;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    background: var(--cream);
    background-image:
      radial-gradient(circle at 10% 5%, var(--cream-deep) 0%, transparent 45%),
      radial-gradient(circle at 90% 0%, #fdf1e6 0%, transparent 40%);
    color: var(--ink);
    font-family: 'Nunito', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 60px;
  }

  h1, h2, .day-label, .meal-name{
    font-family: 'Fredoka', system-ui, sans-serif;
  }

  .app-header{
    text-align: center;
    padding: 36px 20px 20px;
  }

  .app-header h1{
    margin: 0;
    font-size: 2.1rem;
    font-weight: 700;
    color: var(--terracotta-deep);
    letter-spacing: 0.3px;
  }

  .app-header .subtitle{
    margin: 8px auto 0;
    max-width: 560px;
    color: var(--ink-soft);
    font-size: 0.98rem;
  }

  main{
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* ---------- Menu toolbar ---------- */
  .menu-toolbar{
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 22px;
  }

  button{
    font-family: 'Nunito', sans-serif;
    cursor: pointer;
    border: none;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.92rem;
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease;
  }

  button:active{ transform: translateY(1px) scale(0.98); }

  .btn-primary{
    background: var(--terracotta);
    color: white;
    padding: 12px 22px;
    box-shadow: var(--shadow);
  }
  .btn-primary:hover{ background: var(--terracotta-deep); box-shadow: var(--shadow-strong); }

  .btn-secondary{
    background: var(--card);
    color: var(--ink);
    padding: 12px 20px;
    border: 2px solid var(--border);
  }
  .btn-secondary:hover{ border-color: var(--terracotta); color: var(--terracotta-deep); }

  /* ---------- Menu grid ---------- */
  .menu-grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
    gap: 16px;
    margin-bottom: 44px;
  }

  .day-card{
    background: var(--card);
    border-radius: var(--radius);
    padding: 14px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 10px;
    border: 2px solid transparent;
    transition: border-color 0.15s ease, transform 0.1s ease;
    min-height: 190px;
  }

  .day-card.drag-over{
    border-color: var(--gold);
    transform: translateY(-2px);
  }

  .day-card.dragging{ opacity: 0.5; }

  .day-card.locked{
    background: linear-gradient(180deg, #fff, var(--sage-soft) 220%);
  }

  .day-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .day-label{
    font-weight: 600;
    font-size: 1.05rem;
    color: var(--terracotta-deep);
  }

  .lock-toggle{
    background: none;
    padding: 4px 8px;
    font-size: 1.05rem;
    border-radius: 8px;
  }
  .lock-toggle:hover{ background: var(--cream-deep); }

  .meal-chip{
    background: var(--cream);
    border-radius: 12px;
    padding: 10px 12px;
    flex: 1;
    cursor: grab;
    border: 1px dashed var(--border);
  }
  .meal-chip:active{ cursor: grabbing; }
  .meal-chip.flex{
    background: repeating-linear-gradient(45deg, #fff, #fff 8px, var(--cream-deep) 8px, var(--cream-deep) 16px);
    font-style: italic;
  }

  .meal-name{
    font-weight: 600;
    font-size: 0.98rem;
    line-height: 1.25;
  }

  .meal-notes{
    margin-top: 6px;
    font-size: 0.8rem;
    color: var(--ink-soft);
    line-height: 1.3;
  }

  .meal-select{
    width: 100%;
    padding: 8px 10px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: white;
    color: var(--ink);
    font-family: 'Nunito', sans-serif;
    font-size: 0.85rem;
  }
  .meal-select:focus{ outline: none; border-color: var(--terracotta); }

  .locked-hint{
    font-size: 0.78rem;
    color: var(--sage);
    text-align: center;
    font-weight: 700;
  }

  .print-only-name{ display: none; }

  /* ---------- Meal database ---------- */
  .db-section{
    background: var(--card);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
  }

  .db-section h2{
    margin: 0 0 4px;
    color: var(--terracotta-deep);
    font-size: 1.35rem;
  }

  .db-hint{
    margin: 0 0 18px;
    color: var(--ink-soft);
    font-size: 0.88rem;
  }

  .db-toolbar{
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
    align-items: center;
  }

  .db-toolbar input[type="text"]{
    padding: 10px 14px;
    border-radius: 10px;
    border: 2px solid var(--border);
    font-family: 'Nunito', sans-serif;
    font-size: 0.9rem;
    flex: 1 1 160px;
  }
  .db-toolbar input[type="text"]:focus{ outline: none; border-color: var(--terracotta); }

  .import-label{
    background: var(--card);
    color: var(--ink);
    padding: 12px 20px;
    border: 2px solid var(--border);
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.92rem;
    cursor: pointer;
    display: inline-block;
  }
  .import-label:hover{ border-color: var(--terracotta); color: var(--terracotta-deep); }

  .meal-list{
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .meal-row{
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--cream);
    border-radius: 10px;
    padding: 10px 12px;
    border: 1px solid var(--border);
  }
  .meal-row.dragging{ opacity: 0.4; }
  .meal-row.drag-over{ border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) inset; }
  .meal-row.tradition{ background: var(--sage-soft); }

  .drag-handle{
    cursor: grab;
    color: var(--ink-soft);
    font-size: 1.1rem;
    user-select: none;
  }

  .meal-info{ flex: 1; min-width: 0; }
  .meal-row-name{ font-weight: 700; font-size: 0.95rem; }
  .meal-row-notes{ font-size: 0.8rem; color: var(--ink-soft); margin-top: 2px; }

  .meal-row.editing{ border-color: var(--terracotta); background: #fff; }
  .meal-row.editing .drag-handle{ opacity: 0.3; pointer-events: none; }

  .meal-edit{
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .edit-input{
    width: 100%;
    padding: 7px 10px;
    border-radius: 8px;
    border: 2px solid var(--border);
    font-family: 'Nunito', sans-serif;
    font-size: 0.85rem;
    background: white;
    color: var(--ink);
  }
  .edit-input:focus{ outline: none; border-color: var(--terracotta); }

  .meal-actions{
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .tradition-badge{
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--sage);
    white-space: nowrap;
  }

  .edit-btn{
    background: transparent;
    color: var(--terracotta-deep);
    border: 2px solid var(--border);
    padding: 7px 12px;
    font-size: 0.8rem;
    white-space: nowrap;
  }
  .edit-btn:hover{ border-color: var(--terracotta); background: var(--cream); }

  .save-btn{
    background: var(--sage);
    color: white;
    padding: 7px 14px;
    font-size: 0.8rem;
  }
  .save-btn:hover{ background: #5c8a5f; }

  .cancel-btn{
    background: transparent;
    color: var(--ink-soft);
    border: 2px solid var(--border);
    padding: 7px 14px;
    font-size: 0.8rem;
  }
  .cancel-btn:hover{ background: var(--cream-deep); }

  .delete-btn{
    background: transparent;
    color: #b5533a;
    border: 2px solid #f0c9bb;
    padding: 7px 14px;
    font-size: 0.8rem;
    white-space: nowrap;
  }
  .delete-btn:hover{ background: #fdeeea; }
  .delete-btn.confirming{
    background: #d9463c;
    color: white;
    border-color: #d9463c;
  }

  /* ---------- Toast ---------- */
  .toast{
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    background: var(--ink);
    color: white;
    padding: 12px 22px;
    border-radius: 999px;
    font-size: 0.9rem;
    font-weight: 600;
    box-shadow: var(--shadow-strong);
    z-index: 100;
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
  }
  .toast.show{ opacity: 1; }

  footer{
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.8rem;
    margin-top: 40px;
  }

  /* ---------- Print ---------- */
  @media print{
    body{ background: white; padding: 0; }
    .app-header .subtitle, .menu-toolbar, .db-section, .toast, footer,
    .lock-toggle, .meal-select, .locked-hint, .meal-notes { display: none !important; }
    .app-header{ padding: 10px 0; }
    .app-header h1::after{ content: " — Weekly Menu"; }
    main{ max-width: 100%; padding: 0; }
    .menu-grid{ grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .day-card{ box-shadow: none; border: 1px solid #ccc; break-inside: avoid; }
    .print-only-name{ display: block; font-weight: 700; font-family: 'Fredoka', sans-serif; }
    .meal-chip{ display: none; }
  }
</style>
</head>
<body>

<header class="app-header">
  <h1>🍽️ Family Dinner Planner</h1>
  <p class="subtitle">Friday is always pizza &amp; a movie, Thursday is always quesadillas &amp; smoothies — everything else is up for grabs.</p>
</header>

<main>
  <section id="menuSection">
    <div class="menu-toolbar">
      <button id="randomizeBtn" class="btn-primary" type="button">🎲 Randomize Week</button>
      <button id="copyBtn" class="btn-secondary" type="button">📋 Copy Menu</button>
      <button id="printBtn" class="btn-secondary" type="button">🖨️ Print Menu</button>
    </div>
    <div id="menuGrid" class="menu-grid"></div>
  </section>

  <section id="dbSection" class="db-section">
    <h2>Meal Database</h2>
    <p class="db-hint">Drag rows to reorder. This order fills the dropdowns above. Export updates <code>meals.json</code> for GitHub Pages.</p>
    <div class="db-toolbar">
      <input type="text" id="newMealName" placeholder="New meal name">
      <input type="text" id="newMealNotes" placeholder="Notes (optional — e.g. hidden veggie trick)">
      <button id="addMealBtn" class="btn-primary" type="button">+ Add Meal</button>
      <button id="exportBtn" class="btn-secondary" type="button">⬇️ Export meals.json</button>
      <label class="import-label">⬆️ Import &amp; Merge
        <input type="file" id="importInput" accept="application/json,.json" hidden>
      </label>
    </div>
    <ul id="mealList" class="meal-list"></ul>
  </section>
</main>

<footer>Made with ❤️ for weeknight dinners.</footer>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
  "use strict";

  const DAYS = ['fri','sat','sun','mon','tue','wed','thu'];
  const DAY_LABELS = { mon:'Monday', tue:'Tuesday', wed:'Wednesday', thu:'Thursday', fri:'Friday', sat:'Saturday', sun:'Sunday' };
  const REGULAR_DAYS = ['mon','tue','wed','sat','sun'];
  const LOCKABLE_DAYS = ['thu','fri'];
  const FLEX = '__flex__';

  const LS_MEALS = 'dinnerPlanner.meals';
  const LS_MENU = 'dinnerPlanner.menu';
  const LS_LOCKS = 'dinnerPlanner.locks';

  const DEFAULT_MEALS = [
    { id:'trad-fri-pizza', name:'Pizza & Movie Night', notes:"Let everyone build their own personal pizza while a movie plays.", tradition:'fri', emoji:'🍕🎬' },
    { id:'trad-thu-quesadillas', name:'Quesadillas & Smoothies', notes:"Cheese quesadillas with a fruit-and-spinach smoothie — they can't taste the spinach.", tradition:'thu', emoji:'🫓🥤' },
    { id:'spaghetti-meatballs', name:'Spaghetti & Hidden-Veggie Meatballs', notes:'Shredded zucchini and carrot blended right into the meatballs.' },
    { id:'tacos', name:'Build-Your-Own Tacos', notes:'Set out toppings so everyone builds their own plate.' },
    { id:'sheet-pan-chicken', name:'Sheet-Pan Chicken & Roasted Veggies', notes:'A drizzle of honey on the veggies wins over picky eaters.' },
    { id:'baked-ziti', name:'Baked Ziti', notes:'Pureed butternut squash stirred into the sauce — no one notices.' },
    { id:'teriyaki-chicken', name:'Teriyaki Chicken & Rice', notes:'Adventurous-eater favorite. Try adding pineapple chunks.' },
    { id:'turkey-chili', name:'Turkey Chili', notes:'Finely diced bell pepper and carrot cook down until they disappear.' },
    { id:'mac-cheese-squash', name:'Creamy Mac & Cheese', notes:'Butternut squash puree makes the sauce extra creamy (and sneaky).' },
    { id:'veggie-meatloaf', name:'Veggie-Loaded Meatloaf', notes:'Grated carrot, zucchini, and onion mixed right in.' },
    { id:'breakfast-for-dinner', name:'Breakfast for Dinner', notes:'Pancakes, eggs, and fruit — a fun switch-up night.' },
    { id:'chicken-stir-fry', name:'Chicken Stir-Fry', notes:'Adventurous pick — dice the veggies small for the picky eater.' },
    { id:'homemade-nuggets', name:'Homemade Chicken Nuggets & Dip', notes:'Serve with ranch and a side of veggies for dipping.' },
    { id:'burgers', name:'Backyard Burgers', notes:'Grate zucchini into the patty mix for extra moisture (and veggies).' },
    { id:'veggie-fried-rice', name:'Veggie Fried Rice', notes:'Finely chopped veggies mixed right into the rice.' },
    { id:'pasta-primavera', name:'Kid-Style Pasta Primavera', notes:'Extra butter and parmesan on the veggies helps close the deal.' },
    { id:'grilled-cheese-tomato-soup', name:'Grilled Cheese & Tomato Soup', notes:'Blend the soup smooth — hidden veggies included.' },
    { id:'turkey-burgers', name:'Turkey Burgers', notes:'A leaner take on burger night.' },
    { id:'chicken-parmesan', name:'Chicken Parmesan', notes:'Serve with a side of roasted broccoli "fries."' },
    { id:'breakfast-burritos', name:'Breakfast Burritos', notes:'Scrambled eggs, cheese, and finely diced peppers.' },
    { id:'shepherds-pie', name:"Shepherd's Pie", notes:'Mashed cauliflower mixed into the potato topping.' },
    { id:'bbq-chicken', name:'BBQ Chicken & Corn', notes:'A reliable crowd-pleaser for both kids.' },
    { id:'korean-beef-bowls', name:'Korean Beef Bowls', notes:'Adventurous pick — mild spice, easy to dial down.' },
    { id:'sloppy-joes', name:'Sloppy Joes', notes:'Grated carrot cooks right into the sauce.' },
    { id:'sushi-bake', name:'Sushi Bake', notes:'A fun adventurous-eater night — deconstructed sushi in a casserole dish.' },
    { id:'mild-curry', name:'Mild Chicken Curry & Rice', notes:'Adventurous pick — coconut milk keeps it mild and creamy.' },
    { id:'lo-mein', name:'Veggie Lo Mein', notes:'Noodles make the veggies an easy sell.' },
    { id:'pulled-pork-sliders', name:'Pulled Pork Sliders', notes:'Serve coleslaw on the side, or blend it into the sauce.' },
    { id:'orange-chicken', name:'Orange Chicken & Rice', notes:'Sweet enough for the picky eater, interesting enough for the adventurous one.' },
    { id:'fajitas', name:'Sheet-Pan Chicken Fajitas', notes:'Let everyone build their own — cut peppers extra small.' }
  ];

  let state = { meals: [], menu: {}, locks: { thu:true, fri:true } };
  const confirmTimers = new WeakMap();
  const editingIds = new Set();

  // ---------- persistence ----------
  function persistMeals(){ try{ localStorage.setItem(LS_MEALS, JSON.stringify(state.meals)); }catch(e){} }
  function persistMenu(){ try{ localStorage.setItem(LS_MENU, JSON.stringify(state.menu)); }catch(e){} }
  function persistLocks(){ try{ localStorage.setItem(LS_LOCKS, JSON.stringify(state.locks)); }catch(e){} }

  async function loadMeals(){
    try{
      const res = await fetch('./meals.json', { cache:'no-store' });
      if(res.ok){
        const data = await res.json();
        if(Array.isArray(data) && data.length){
          return data;
        }
      }
    }catch(err){ /* fetch unavailable (e.g. opened as a local file) — fall back */ }
    try{
      const stored = localStorage.getItem(LS_MEALS);
      if(stored){
        const parsed = JSON.parse(stored);
        if(Array.isArray(parsed) && parsed.length) return parsed;
      }
    }catch(err){ /* ignore corrupt storage */ }
    return JSON.parse(JSON.stringify(DEFAULT_MEALS));
  }

  function loadMenuAndLocks(){
    let menu = null, locks = null;
    try{ const m = localStorage.getItem(LS_MENU); if(m) menu = JSON.parse(m); }catch(e){}
    try{ const l = localStorage.getItem(LS_LOCKS); if(l) locks = JSON.parse(l); }catch(e){}
    return { menu, locks };
  }

  // ---------- helpers ----------
  function mealById(id){ return state.meals.find(m => m.id === id); }
  function traditionMealFor(day){ return state.meals.find(m => m.tradition === day); }
  function mealDisplayName(meal){ return meal ? ((meal.emoji ? meal.emoji + ' ' : '') + meal.name) : ''; }

  // Keeps the two tradition meals' emoji current even if a browser's saved
  // localStorage copy (or an older meals.json on the server) predates this field.
  function syncTraditionEmoji(){
    let changed = false;
    DEFAULT_MEALS.forEach(dm => {
      if(!dm.tradition) return;
      const existing = state.meals.find(m => m.id === dm.id);
      if(existing && existing.emoji !== dm.emoji){
        existing.emoji = dm.emoji;
        changed = true;
      }
    });
    return changed;
  }
  function isLockedDay(day){ return LOCKABLE_DAYS.includes(day) && !!state.locks[day]; }
  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ---------- core actions ----------
  function randomize(){
    const pool = state.meals.filter(m => !m.tradition);
    const flexDay = REGULAR_DAYS[Math.floor(Math.random() * REGULAR_DAYS.length)];
    const cookDays = REGULAR_DAYS.filter(d => d !== flexDay);
    const shuffledPool = shuffle(pool);

    cookDays.forEach((day, i) => {
      state.menu[day] = shuffledPool.length ? shuffledPool[i % shuffledPool.length].id : FLEX;
    });
    state.menu[flexDay] = FLEX;

    LOCKABLE_DAYS.forEach(day => {
      if(state.locks[day]){
        const t = traditionMealFor(day);
        state.menu[day] = t ? t.id : FLEX;
      } else {
        state.menu[day] = pool.length ? pool[Math.floor(Math.random() * pool.length)].id : FLEX;
      }
    });

    persistMenu();
    renderMenu();
    showToast('Week randomized!');
  }

  function toggleLock(day){
    state.locks[day] = !state.locks[day];
    if(state.locks[day]){
      const t = traditionMealFor(day);
      state.menu[day] = t ? t.id : FLEX;
    }
    persistLocks();
    persistMenu();
    renderMenu();
  }

  function setDayMeal(day, value){
    if(isLockedDay(day)) return;
    state.menu[day] = value;
    persistMenu();
    renderMenu();
  }

  function swapDays(dayA, dayB){
    if(!dayA || dayA === dayB) return;
    if(isLockedDay(dayA) || isLockedDay(dayB)) return;
    const tmp = state.menu[dayA];
    state.menu[dayA] = state.menu[dayB];
    state.menu[dayB] = tmp;
    persistMenu();
    renderMenu();
  }

  function addMeal(name, notes){
    name = (name || '').trim();
    if(!name) return;
    const id = 'm-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
    state.meals.push({ id, name, notes: (notes || '').trim() });
    persistMeals();
    renderDatabase();
    renderMenu();
  }

  function removeMeal(id){
    const m = mealById(id);
    if(!m || m.tradition) return;
    state.meals = state.meals.filter(x => x.id !== id);
    DAYS.forEach(day => { if(state.menu[day] === id) state.menu[day] = FLEX; });
    persistMeals();
    persistMenu();
    renderDatabase();
    renderMenu();
  }

  function saveMealEdit(id, name, notes){
    name = (name || '').trim();
    if(!name){ showToast('Meal name cannot be empty.'); return; }
    const m = mealById(id);
    if(!m) return;
    m.name = name;
    m.notes = (notes || '').trim();
    editingIds.delete(id);
    persistMeals();
    renderDatabase();
    renderMenu();
    showToast('Meal updated.');
  }

  function reorderMeals(fromIndex, toIndex){
    if(fromIndex === toIndex || fromIndex < 0 || fromIndex >= state.meals.length) return;
    const arr = state.meals;
    const [item] = arr.splice(fromIndex, 1);
    arr.splice(toIndex, 0, item);
    persistMeals();
    renderDatabase();
    renderMenu();
  }

  function exportMeals(){
    const data = JSON.stringify(state.meals, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'meals.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('meals.json exported — commit it to update GitHub Pages.');
  }

  function importMealsFromFile(file){
    const reader = new FileReader();
    reader.onload = (e) => {
      try{
        const imported = JSON.parse(e.target.result);
        if(!Array.isArray(imported)) throw new Error('not an array');
        let added = 0;
        imported.forEach(m => {
          if(!m || typeof m.name !== 'string' || !m.name.trim()) return;
          const nameKey = m.name.trim().toLowerCase();
          const exists = state.meals.some(existing =>
            (m.id && existing.id === m.id) || existing.name.trim().toLowerCase() === nameKey
          );
          if(!exists){
            state.meals.push({
              id: (m.id && typeof m.id === 'string') ? m.id : ('m-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7)),
              name: m.name.trim(),
              notes: typeof m.notes === 'string' ? m.notes.trim() : ''
              // tradition flags are never imported — those two slots stay protected
            });
            added++;
          }
        });
        persistMeals();
        renderDatabase();
        renderMenu();
        showToast(added ? `Imported ${added} new meal${added === 1 ? '' : 's'}.` : 'No new meals found to import.');
      }catch(err){
        showToast('Import failed — please choose a valid meals.json file.');
      }
    };
    reader.readAsText(file);
  }

  function buildMenuText(){
    const lines = ['🍽️ Weekly Dinner Menu', ''];
    DAYS.forEach(day => {
      const id = state.menu[day];
      let text;
      if(id === FLEX) text = 'Flexible night (eating out / leftovers)';
      else { const m = mealById(id); text = m ? mealDisplayName(m) : '—'; }
      lines.push(`${DAY_LABELS[day]}: ${text}`);
    });
    return lines.join('\n');
  }

  function fallbackCopy(text){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try{
      document.execCommand('copy');
      showToast('Menu copied to clipboard!');
    }catch(e){
      showToast('Could not copy automatically — please copy manually.');
    }
    document.body.removeChild(ta);
  }

  function copyMenu(){
    const text = buildMenuText();
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(
        () => showToast('Menu copied to clipboard!'),
        () => fallbackCopy(text)
      );
    } else {
      fallbackCopy(text);
    }
  }

  let toastTimer = null;
  function showToast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.hidden = false;
    requestAnimationFrame(() => el.classList.add('show'));
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      el.classList.remove('show');
      setTimeout(() => { el.hidden = true; }, 260);
    }, 2600);
  }

  // ---------- rendering ----------
  function renderMenu(){
    const grid = document.getElementById('menuGrid');
    grid.innerHTML = '';

    DAYS.forEach(day => {
      const locked = isLockedDay(day);
      const card = document.createElement('div');
      card.className = 'day-card' + (locked ? ' locked' : '');
      card.dataset.day = day;

      const header = document.createElement('div');
      header.className = 'day-header';
      const label = document.createElement('span');
      label.className = 'day-label';
      label.textContent = DAY_LABELS[day];
      header.appendChild(label);

      if(LOCKABLE_DAYS.includes(day)){
        const lockBtn = document.createElement('button');
        lockBtn.type = 'button';
        lockBtn.className = 'lock-toggle';
        lockBtn.title = locked ? 'Unlock this night' : 'Lock to tradition';
        lockBtn.textContent = locked ? '🔒' : '🔓';
        lockBtn.addEventListener('click', () => toggleLock(day));
        header.appendChild(lockBtn);
      }
      card.appendChild(header);

      const mealId = state.menu[day];
      const meal = mealId === FLEX ? null : mealById(mealId);

      const chip = document.createElement('div');
      chip.className = 'meal-chip' + (mealId === FLEX ? ' flex' : '');
      chip.draggable = !locked;
      if(!locked){
        chip.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/plain', day);
          card.classList.add('dragging');
        });
        chip.addEventListener('dragend', () => card.classList.remove('dragging'));
      }

      const nameEl = document.createElement('div');
      nameEl.className = 'meal-name';
      nameEl.textContent = mealId === FLEX ? '🍽️ Flexible Night' : (meal ? mealDisplayName(meal) : '— Select a meal —');
      chip.appendChild(nameEl);

      const noteText = mealId === FLEX ? 'Eating out, leftovers, or whatever sounds good.' : (meal && meal.notes ? meal.notes : '');
      if(noteText){
        const notesEl = document.createElement('div');
        notesEl.className = 'meal-notes';
        notesEl.textContent = noteText;
        chip.appendChild(notesEl);
      }
      card.appendChild(chip);

      const printOnly = document.createElement('div');
      printOnly.className = 'print-only-name';
      printOnly.textContent = nameEl.textContent;
      card.appendChild(printOnly);

      if(locked){
        const hint = document.createElement('div');
        hint.className = 'locked-hint';
        hint.textContent = 'Locked to tradition — unlock to change';
        card.appendChild(hint);
      } else {
        const select = document.createElement('select');
        select.className = 'meal-select';
        const flexOpt = document.createElement('option');
        flexOpt.value = FLEX;
        flexOpt.textContent = '🍽️ Flexible Night';
        select.appendChild(flexOpt);
        state.meals.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = mealDisplayName(m);
          select.appendChild(opt);
        });
        select.value = mealId;
        select.addEventListener('change', (e) => setDayMeal(day, e.target.value));
        card.appendChild(select);

        card.addEventListener('dragover', (e) => { e.preventDefault(); card.classList.add('drag-over'); });
        card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
        card.addEventListener('drop', (e) => {
          e.preventDefault();
          card.classList.remove('drag-over');
          const fromDay = e.dataTransfer.getData('text/plain');
          swapDays(fromDay, day);
        });
      }

      grid.appendChild(card);
    });
  }

  function renderDatabase(){
    const list = document.getElementById('mealList');
    list.innerHTML = '';

    state.meals.forEach((m, idx) => {
      const li = document.createElement('li');
      const editing = editingIds.has(m.id);
      li.className = 'meal-row' + (m.tradition ? ' tradition' : '') + (editing ? ' editing' : '');
      li.draggable = !editing;
      li.dataset.index = String(idx);

      if(!editing){
        li.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/plain', String(idx));
          li.classList.add('dragging');
        });
        li.addEventListener('dragend', () => li.classList.remove('dragging'));
        li.addEventListener('dragover', (e) => { e.preventDefault(); li.classList.add('drag-over'); });
        li.addEventListener('dragleave', () => li.classList.remove('drag-over'));
        li.addEventListener('drop', (e) => {
          e.preventDefault();
          li.classList.remove('drag-over');
          const fromIdx = parseInt(e.dataTransfer.getData('text/plain'), 10);
          if(!isNaN(fromIdx)) reorderMeals(fromIdx, idx);
        });
      }

      const handle = document.createElement('span');
      handle.className = 'drag-handle';
      handle.textContent = '⠿';
      li.appendChild(handle);

      if(editing){
        const editWrap = document.createElement('div');
        editWrap.className = 'meal-edit';

        const nameInput = document.createElement('input');
        nameInput.type = 'text';
        nameInput.className = 'edit-input edit-name';
        nameInput.value = m.name;
        nameInput.placeholder = 'Meal name';
        editWrap.appendChild(nameInput);

        const notesInput = document.createElement('input');
        notesInput.type = 'text';
        notesInput.className = 'edit-input edit-notes';
        notesInput.value = m.notes || '';
        notesInput.placeholder = 'Notes (optional)';
        editWrap.appendChild(notesInput);

        li.appendChild(editWrap);

        const actions = document.createElement('div');
        actions.className = 'meal-actions';

        const saveBtn = document.createElement('button');
        saveBtn.type = 'button';
        saveBtn.className = 'save-btn';
        saveBtn.textContent = 'Save';
        actions.appendChild(saveBtn);

        const cancelBtn = document.createElement('button');
        cancelBtn.type = 'button';
        cancelBtn.className = 'cancel-btn';
        cancelBtn.textContent = 'Cancel';
        actions.appendChild(cancelBtn);

        li.appendChild(actions);

        saveBtn.addEventListener('click', () => saveMealEdit(m.id, nameInput.value, notesInput.value));
        cancelBtn.addEventListener('click', () => { editingIds.delete(m.id); renderDatabase(); });
        [nameInput, notesInput].forEach(inp => {
          inp.addEventListener('keydown', (e) => {
            if(e.key === 'Enter') saveBtn.click();
            if(e.key === 'Escape') cancelBtn.click();
          });
        });
      } else {
        const info = document.createElement('div');
        info.className = 'meal-info';
        const nm = document.createElement('div');
        nm.className = 'meal-row-name';
        nm.textContent = mealDisplayName(m);
        info.appendChild(nm);
        if(m.notes){
          const nt = document.createElement('div');
          nt.className = 'meal-row-notes';
          nt.textContent = m.notes;
          info.appendChild(nt);
        }
        li.appendChild(info);

        const actions = document.createElement('div');
        actions.className = 'meal-actions';

        const editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.className = 'edit-btn';
        editBtn.textContent = '✏️ Edit';
        editBtn.addEventListener('click', () => { editingIds.add(m.id); renderDatabase(); });
        actions.appendChild(editBtn);

        if(m.tradition){
          const badge = document.createElement('span');
          badge.className = 'tradition-badge';
          badge.textContent = '🔒 ' + DAY_LABELS[m.tradition] + ' tradition';
          actions.appendChild(badge);
        } else {
          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'delete-btn';
          delBtn.textContent = 'Remove';
          delBtn.addEventListener('click', () => {
            if(delBtn.classList.contains('confirming')){
              clearTimeout(confirmTimers.get(delBtn));
              confirmTimers.delete(delBtn);
              removeMeal(m.id);
            } else {
              delBtn.classList.add('confirming');
              delBtn.textContent = 'Confirm?';
              const t = setTimeout(() => {
                delBtn.classList.remove('confirming');
                delBtn.textContent = 'Remove';
                confirmTimers.delete(delBtn);
              }, 4000);
              confirmTimers.set(delBtn, t);
            }
          });
          actions.appendChild(delBtn);
        }

        li.appendChild(actions);
      }

      list.appendChild(li);
    });
  }

  // ---------- global controls ----------
  function bindGlobalControls(){
    document.getElementById('randomizeBtn').addEventListener('click', randomize);
    document.getElementById('copyBtn').addEventListener('click', copyMenu);
    document.getElementById('printBtn').addEventListener('click', () => window.print());

    document.getElementById('addMealBtn').addEventListener('click', () => {
      const nameInput = document.getElementById('newMealName');
      const notesInput = document.getElementById('newMealNotes');
      addMeal(nameInput.value, notesInput.value);
      nameInput.value = '';
      notesInput.value = '';
      nameInput.focus();
    });
    document.getElementById('newMealName').addEventListener('keydown', (e) => {
      if(e.key === 'Enter') document.getElementById('addMealBtn').click();
    });

    document.getElementById('exportBtn').addEventListener('click', exportMeals);
    document.getElementById('importInput').addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if(file) importMealsFromFile(file);
      e.target.value = '';
    });

    // click elsewhere cancels a pending delete confirmation
    document.addEventListener('click', (e) => {
      document.querySelectorAll('.delete-btn.confirming').forEach(btn => {
        if(btn !== e.target){
          btn.classList.remove('confirming');
          btn.textContent = 'Remove';
          const t = confirmTimers.get(btn);
          if(t) clearTimeout(t);
          confirmTimers.delete(btn);
        }
      });
    });
  }

  // ---------- init ----------
  async function init(){
    state.meals = await loadMeals();
    syncTraditionEmoji();
    persistMeals();

    const { menu, locks } = loadMenuAndLocks();
    if(menu && locks && DAYS.every(d => d in menu)){
      state.menu = menu;
      state.locks = Object.assign({ thu:true, fri:true }, locks);
    } else {
      state.locks = { thu:true, fri:true };
      state.menu = {};
      DAYS.forEach(d => { state.menu[d] = ''; });
      const tFri = traditionMealFor('fri');
      const tThu = traditionMealFor('thu');
      state.menu.fri = tFri ? tFri.id : FLEX;
      state.menu.thu = tThu ? tThu.id : FLEX;
      randomize();
    }

    renderMenu();
    renderDatabase();
    bindGlobalControls();
  }

  init();
})();
</script>
