<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tunes</title>
<meta name="description" content="Browse and rate Reeve's songs for the band to consider playing live.">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    html, body {
        min-height: 100%;
    }
    body {
        background: #121212;
        color: #eee;
        font-family: 'Montserrat', sans-serif;
        padding: 24px 16px 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .wrap {
        width: 100%;
        max-width: 820px;
    }
    h1 {
        font-size: clamp(32px, 8vw, 44px);
        font-weight: 700;
        text-align: center;
    }
    .subtitle {
        color: #aaa;
        text-align: center;
        font-size: 14px;
        line-height: 1.5;
        margin: 10px auto 24px;
        max-width: 560px;
    }
    .subtitle strong {
        color: #eee;
    }

    .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        margin-bottom: 14px;
    }
    .pill {
        font-family: inherit;
        font-size: 14px;
        padding: 7px 14px;
        background: #262626;
        border: 1px solid #3a3a3a;
        color: #ccc;
        border-radius: 999px;
        cursor: pointer;
        white-space: nowrap;
    }
    .pill:hover {
        background: #303030;
    }
    .pill.active {
        background: #e0a94e;
        border-color: #e0a94e;
        color: #1a1a1a;
        font-weight: 600;
    }
    .filter-pill.active {
        background: #3a7d44;
        border-color: #3a7d44;
        color: #fff;
    }

    .layout {
        display: flex;
        gap: 20px;
        align-items: flex-start;
        margin-top: 20px;
    }

    .player {
        flex: 0 0 240px;
        position: sticky;
        top: 16px;
        background: #1c1c1c;
        border: 1px solid #2a2a2a;
        border-radius: 12px;
        padding: 18px;
    }
    .player .project-tag {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #e0a94e;
        margin-bottom: 4px;
        min-height: 14px;
    }
    .player .now-title {
        font-weight: 600;
        font-size: 16px;
        line-height: 1.3;
        margin-bottom: 14px;
        min-height: 42px;
    }
    .player .now-title.placeholder {
        color: #777;
        font-weight: 400;
        font-size: 14px;
    }
    .scrub {
        width: 100%;
        margin-bottom: 4px;
        accent-color: #e0a94e;
    }
    .time-row {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: #888;
        font-variant-numeric: tabular-nums;
        margin-bottom: 14px;
    }
    .transport {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
    }
    .transport button {
        font-family: inherit;
        font-size: 18px;
        background: #262626;
        border: 1px solid #3a3a3a;
        color: #eee;
        border-radius: 8px;
        padding: 8px 12px;
        cursor: pointer;
    }
    .transport button:hover:not(:disabled) {
        background: #303030;
    }
    .transport button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
    }
    .transport #playPauseBtn {
        background: #3a7d44;
        border-color: #3a7d44;
        font-size: 20px;
        padding: 8px 16px;
    }
    .transport #playPauseBtn:hover:not(:disabled) {
        background: #458f51;
    }
    .player .rate-group {
        display: flex;
        justify-content: center;
        gap: 8px;
    }

    .list {
        flex: 1 1 auto;
        min-width: 0;
    }
    .project-heading {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #e0a94e;
        margin: 18px 0 6px;
        padding-bottom: 6px;
        border-bottom: 1px solid #2a2a2a;
    }
    .project-heading:first-child {
        margin-top: 0;
    }
    .song-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 6px;
        border-bottom: 1px solid #212121;
        cursor: pointer;
        border-radius: 6px;
    }
    .song-row:hover {
        background: #1a1a1a;
    }
    .song-row.current {
        background: #232316;
        border-bottom-color: #2a2a2a;
    }
    .song-row .title {
        flex: 1 1 auto;
        min-width: 0;
        font-size: 14.5px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .song-row.current .title {
        color: #e0a94e;
        font-weight: 600;
    }
    .song-row .now-icon {
        font-size: 13px;
        color: #e0a94e;
        width: 14px;
        flex-shrink: 0;
        text-align: center;
    }
    .rate-btn {
        font-size: 16px;
        line-height: 1;
        padding: 4px 6px;
        background: #262626;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        cursor: pointer;
        filter: grayscale(1);
        opacity: 0.5;
        flex-shrink: 0;
    }
    .player .rate-btn {
        font-size: 19px;
        padding: 6px 10px;
    }
    .rate-btn:hover {
        opacity: 0.85;
    }
    .rate-btn.selected {
        filter: none;
        opacity: 1;
        background: #333;
        border-color: #e0a94e;
        box-shadow: 0 0 0 1px #e0a94e;
    }

    .state {
        text-align: center;
        color: #999;
        font-size: 14px;
        line-height: 1.6;
        margin-top: 30px;
        padding: 0 10px;
    }
    .state code {
        background: #262626;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 13px;
    }

    footer {
        margin-top: 34px;
        text-align: center;
        color: #555;
        font-size: 12px;
        line-height: 1.6;
        max-width: 480px;
        margin-left: auto;
        margin-right: auto;
    }
    footer code {
        color: #777;
    }
    footer button {
        margin-top: 10px;
        font-family: inherit;
        font-size: 12px;
        background: none;
        border: 1px solid #3a3a3a;
        color: #777;
        padding: 5px 12px;
        border-radius: 6px;
        cursor: pointer;
    }
    footer button:hover {
        color: #aaa;
        border-color: #555;
    }

    @media (max-width: 640px) {
        .layout {
            flex-direction: column;
        }
        .player {
            position: static;
            width: 100%;
            flex-basis: auto;
        }
    }
</style>
</head>
<body>
<div class="wrap">
    <h1>Tunes</h1>
    <p class="subtitle">
        Listen through and mark how you feel about each one &mdash;
        <strong>&#128169; pass</strong>,
        <strong>&#129335;&zwj;&#9794;&#65039; maybe</strong>,
        <strong>&#129304; let's play it</strong>.
        Then filter down to what you want and screenshot the list to send back.
    </p>

    <div id="projectBar" class="bar"></div>
    <div class="bar">
        <button class="pill filter-pill active" data-filter="play">&#129304; play</button>
        <button class="pill filter-pill active" data-filter="maybe">&#129335;&zwj;&#9794;&#65039; maybe</button>
        <button class="pill filter-pill active" data-filter="pass">&#128169; pass</button>
        <button class="pill filter-pill active" data-filter="unrated">unrated</button>
    </div>

    <div class="layout">
        <div class="player">
            <div class="project-tag" id="nowProject"></div>
            <div class="now-title placeholder" id="nowTitle">Pick a song to start</div>
            <input type="range" class="scrub" id="scrub" value="0" min="0" max="0" step="0.1" disabled>
            <div class="time-row"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
            <div class="transport">
                <button id="prevBtn" disabled title="Previous">&#9198;</button>
                <button id="playPauseBtn" disabled title="Play">&#9654;</button>
                <button id="nextBtn" disabled title="Next">&#9197;</button>
            </div>
            <div class="rate-group" id="playerRateGroup"></div>
            <audio id="audioEl" preload="none"></audio>
        </div>

        <div class="list" id="list"></div>
    </div>

    <div id="state" class="state"></div>
    <footer id="footer"></footer>
</div>

<script>
(function () {
    var OWNER = 'ReeveHunter';
    var REPO = 'ReeveHunter.github.io';
    var BRANCH = 'main';
    var SONGS_ROOT = 'tunes/songs/';
    var AUDIO_EXT = /\.(mp3|wav|m4a|ogg|flac|aac)$/i;
    var RATING_KEY = 'tunes-ratings-v1';
    var RATINGS = ['play', 'maybe', 'pass'];
    var EMOJI = { play: '\u{1F918}', maybe: '\u{1F937}‍♂️', pass: '\u{1F4A9}' };

    var listEl = document.getElementById('list');
    var stateEl = document.getElementById('state');
    var projectBarEl = document.getElementById('projectBar');
    var footerEl = document.getElementById('footer');

    var nowProjectEl = document.getElementById('nowProject');
    var nowTitleEl = document.getElementById('nowTitle');
    var scrubEl = document.getElementById('scrub');
    var curTimeEl = document.getElementById('curTime');
    var durTimeEl = document.getElementById('durTime');
    var prevBtn = document.getElementById('prevBtn');
    var playPauseBtn = document.getElementById('playPauseBtn');
    var nextBtn = document.getElementById('nextBtn');
    var playerRateGroupEl = document.getElementById('playerRateGroup');
    var audioEl = document.getElementById('audioEl');

    var activeFilters = { play: true, maybe: true, pass: true, unrated: true };
    var activeProject = 'all';
    var songs = []; // { path, title, project }
    var currentPath = null;
    var scrubbing = false;

    function loadRatings() {
        try {
            return JSON.parse(localStorage.getItem(RATING_KEY)) || {};
        } catch (e) {
            return {};
        }
    }
    function saveRatings(r) {
        try {
            localStorage.setItem(RATING_KEY, JSON.stringify(r));
        } catch (e) {}
    }
    var ratings = loadRatings();

    function titleFromFilename(name) {
        var base = name.replace(AUDIO_EXT, '');
        base = base.replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim();
        return base.replace(/\b\w/g, function (c, i, str) {
            var word = str.slice(str.lastIndexOf(' ', i) + 1).match(/^\S*/)[0];
            return word === word.toLowerCase() ? c.toUpperCase() : c;
        });
    }

    function audioUrlFor(path) {
        return '/' + path.split('/').map(encodeURIComponent).join('/');
    }

    function fmtTime(sec) {
        if (!isFinite(sec) || sec < 0) sec = 0;
        var m = Math.floor(sec / 60);
        var s = Math.floor(sec % 60);
        return m + ':' + (s < 10 ? '0' : '') + s;
    }

    function songByPath(path) {
        for (var i = 0; i < songs.length; i++) {
            if (songs[i].path === path) return songs[i];
        }
        return null;
    }

    // songs currently visible given project + rating filters, in the same
    // order they're rendered (project asc, title asc within project)
    function visibleSongs() {
        var list = songs.filter(function (s) {
            if (activeProject !== 'all' && s.project !== activeProject) return false;
            var r = ratings[s.path];
            if (!r) return activeFilters.unrated;
            return activeFilters[r];
        });
        list.sort(function (a, b) {
            if (a.project !== b.project) return a.project.localeCompare(b.project);
            return a.title.localeCompare(b.title);
        });
        return list;
    }

    function renderRateGroup(container, path, size) {
        container.innerHTML = '';
        RATINGS.forEach(function (r) {
            var btn = document.createElement('button');
            btn.className = 'rate-btn' + (ratings[path] === r ? ' selected' : '');
            btn.textContent = EMOJI[r];
            btn.setAttribute('aria-label', r);
            btn.onclick = function (ev) {
                ev.stopPropagation();
                if (ratings[path] === r) {
                    delete ratings[path];
                } else {
                    ratings[path] = r;
                }
                saveRatings(ratings);
                renderList();
                renderPlayerInfo();
            };
            container.appendChild(btn);
        });
    }

    function playSong(song) {
        currentPath = song.path;
        audioEl.src = audioUrlFor(song.path);
        audioEl.play().catch(function () {});
        renderPlayerInfo();
        renderList();
    }

    function renderPlayerInfo() {
        var song = currentPath ? songByPath(currentPath) : null;
        if (!song) {
            nowProjectEl.textContent = '';
            nowTitleEl.textContent = 'Pick a song to start';
            nowTitleEl.classList.add('placeholder');
            playerRateGroupEl.innerHTML = '';
            prevBtn.disabled = true;
            playPauseBtn.disabled = true;
            nextBtn.disabled = true;
            return;
        }
        nowProjectEl.textContent = song.project;
        nowTitleEl.textContent = song.title;
        nowTitleEl.classList.remove('placeholder');
        renderRateGroup(playerRateGroupEl, song.path);
        prevBtn.disabled = false;
        playPauseBtn.disabled = false;
        nextBtn.disabled = false;
        playPauseBtn.innerHTML = audioEl.paused ? '&#9654;' : '&#9208;';
        playPauseBtn.title = audioEl.paused ? 'Play' : 'Pause';
    }

    function step(delta) {
        var list = visibleSongs();
        if (list.length === 0) return;
        var idx = list.findIndex(function (s) { return s.path === currentPath; });
        var nextIdx;
        if (idx === -1) {
            nextIdx = delta > 0 ? 0 : list.length - 1;
        } else {
            nextIdx = idx + delta;
            if (nextIdx < 0) nextIdx = list.length - 1;
            if (nextIdx >= list.length) nextIdx = 0;
        }
        playSong(list[nextIdx]);
    }

    playPauseBtn.addEventListener('click', function () {
        if (!currentPath) {
            step(1);
            return;
        }
        if (audioEl.paused) audioEl.play().catch(function () {});
        else audioEl.pause();
    });
    prevBtn.addEventListener('click', function () { step(-1); });
    nextBtn.addEventListener('click', function () { step(1); });

    audioEl.addEventListener('play', renderPlayerInfo);
    audioEl.addEventListener('pause', renderPlayerInfo);
    audioEl.addEventListener('ended', function () { step(1); });
    audioEl.addEventListener('loadedmetadata', function () {
        scrubEl.max = audioEl.duration || 0;
        scrubEl.disabled = false;
        durTimeEl.textContent = fmtTime(audioEl.duration);
    });
    audioEl.addEventListener('timeupdate', function () {
        if (scrubbing) return;
        scrubEl.value = audioEl.currentTime;
        curTimeEl.textContent = fmtTime(audioEl.currentTime);
    });
    scrubEl.addEventListener('input', function () {
        scrubbing = true;
        curTimeEl.textContent = fmtTime(scrubEl.value);
    });
    scrubEl.addEventListener('change', function () {
        audioEl.currentTime = parseFloat(scrubEl.value);
        scrubbing = false;
    });

    function renderList() {
        listEl.innerHTML = '';

        var visibleProjects = songs.reduce(function (acc, s) {
            if (acc.indexOf(s.project) === -1) acc.push(s.project);
            return acc;
        }, []);
        visibleProjects.sort(function (a, b) {
            if (a === 'Uncategorized') return 1;
            if (b === 'Uncategorized') return -1;
            return a.localeCompare(b);
        });

        projectBarEl.innerHTML = '';
        var allBtn = document.createElement('button');
        allBtn.className = 'pill' + (activeProject === 'all' ? ' active' : '');
        allBtn.textContent = 'All';
        allBtn.onclick = function () { activeProject = 'all'; renderList(); };
        projectBarEl.appendChild(allBtn);
        visibleProjects.forEach(function (p) {
            var b = document.createElement('button');
            b.className = 'pill' + (activeProject === p ? ' active' : '');
            b.textContent = p;
            b.onclick = function () { activeProject = p; renderList(); };
            projectBarEl.appendChild(b);
        });

        var toShow = visibleSongs();

        if (songs.length === 0) {
            return;
        }
        if (toShow.length === 0) {
            stateEl.textContent = 'Nothing matches the current filters.';
            return;
        }
        stateEl.textContent = '';

        var lastProject = null;
        toShow.forEach(function (s) {
            if (activeProject === 'all' && s.project !== lastProject) {
                var h = document.createElement('div');
                h.className = 'project-heading';
                h.textContent = s.project;
                listEl.appendChild(h);
                lastProject = s.project;
            }

            var row = document.createElement('div');
            row.className = 'song-row' + (s.path === currentPath ? ' current' : '');
            row.onclick = function () { playSong(s); };

            var icon = document.createElement('span');
            icon.className = 'now-icon';
            icon.textContent = (s.path === currentPath && !audioEl.paused) ? '♪' : '';
            row.appendChild(icon);

            var title = document.createElement('div');
            title.className = 'title';
            title.textContent = s.title;
            row.appendChild(title);

            var rg = document.createElement('div');
            rg.className = 'rate-group';
            renderRateGroup(rg, s.path);
            row.appendChild(rg);

            listEl.appendChild(row);
        });
    }

    document.querySelectorAll('.filter-pill').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var f = btn.getAttribute('data-filter');
            activeFilters[f] = !activeFilters[f];
            btn.classList.toggle('active', activeFilters[f]);
            renderList();
        });
    });

    function showFooter() {
        footerEl.innerHTML =
            'Add songs by dropping audio files into <code>/tunes/songs/&lt;project name&gt;/</code> in the repo and pushing &mdash; folders show up here automatically as tabs.';
        var clearBtn = document.createElement('button');
        clearBtn.textContent = 'Clear my ratings';
        clearBtn.onclick = function () {
            ratings = {};
            saveRatings(ratings);
            renderList();
            renderPlayerInfo();
        };
        footerEl.appendChild(document.createElement('br'));
        footerEl.appendChild(clearBtn);
    }

    renderPlayerInfo();
    stateEl.textContent = 'Loading songs…';
    fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + '/git/trees/' + BRANCH + '?recursive=1')
        .then(function (res) {
            if (!res.ok) throw new Error('GitHub API returned ' + res.status);
            return res.json();
        })
        .then(function (data) {
            var tree = data.tree || [];
            tree.forEach(function (item) {
                if (item.type !== 'blob') return;
                if (item.path.indexOf(SONGS_ROOT) !== 0) return;
                if (!AUDIO_EXT.test(item.path)) return;
                var rest = item.path.slice(SONGS_ROOT.length);
                var slash = rest.indexOf('/');
                var project = slash === -1 ? 'Uncategorized' : rest.slice(0, slash);
                var filename = slash === -1 ? rest : rest.slice(slash + 1);
                songs.push({
                    path: item.path,
                    title: titleFromFilename(filename),
                    project: project
                });
            });

            if (songs.length === 0) {
                stateEl.innerHTML = 'No songs yet.<br><br>Drop audio files into<br><code>/tunes/songs/&lt;project name&gt;/</code><br>in the repo and push &mdash; they\'ll show up here.';
            } else {
                stateEl.textContent = '';
            }
            showFooter();
            renderList();
        })
        .catch(function (err) {
            stateEl.innerHTML = 'Couldn\'t load the song list right now.<br><span style="color:#666;font-size:12px;">(' + err.message + ')</span>';
            showFooter();
        });
})();
</script>
</body>
</html>
