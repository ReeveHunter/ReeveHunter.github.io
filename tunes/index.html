<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tunes</title>
<meta name="description" content="Browse and play Reeve's songs.">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    html, body {
        min-height: 100%;
    }
    body {
        background-color: #000;
        background-image:
            radial-gradient(#fff 1px, transparent 1px),
            radial-gradient(#fff 1px, transparent 1px);
        background-size: 140px 140px, 90px 90px;
        background-position: 0 0, 45px 60px;
        color: #ddd;
        font-family: 'Times New Roman', Times, serif;
        padding: 28px 16px 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .wrap {
        width: 100%;
        max-width: 820px;
    }

    .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        padding-bottom: 16px;
        margin-bottom: 20px;
        border-bottom: 6px solid transparent;
        border-image: linear-gradient(90deg, #ff3b3b, #ffb400, #ffe93b, #3bff6e, #3bd7ff, #a13bff, #ff3bd7) 1;
    }
    .pill {
        font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
        font-size: 14px;
        font-weight: bold;
        padding: 7px 14px;
        background: #c8c8d4;
        border: 3px outset #e8e8f2;
        color: #111;
        cursor: pointer;
        white-space: nowrap;
        box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.6);
    }
    .pill:hover {
        background: #dcdce6;
    }
    .pill:active {
        border-style: inset;
    }
    .pill.active {
        background: #ffe93b;
        border-color: #fff6b0;
        color: #700;
        border-style: inset;
        box-shadow: inset 1px 1px 0 rgba(0, 0, 0, 0.4);
    }

    .layout {
        display: flex;
        gap: 20px;
        align-items: flex-start;
    }

    .player {
        flex: 0 0 240px;
        position: sticky;
        top: 16px;
        background: #c8c8d4;
        border: 4px outset #e8e8f2;
        border-radius: 2px;
        padding: 16px;
        box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.65);
        color: #111;
    }
    .cover {
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        border: 3px inset #888;
        margin-bottom: 14px;
        background: #999;
        display: none;
    }
    .cover.show {
        display: block;
    }
    .player .project-tag {
        font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
        font-size: 11px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #7a0099;
        margin-bottom: 4px;
        min-height: 14px;
    }
    .player .now-title {
        font-weight: bold;
        font-size: 17px;
        line-height: 1.3;
        margin-bottom: 14px;
        min-height: 42px;
        color: #111;
        text-shadow: 1px 1px 0 #fff;
    }
    .player .now-title.placeholder {
        color: #555;
        font-weight: normal;
        font-size: 14px;
        text-shadow: none;
        font-style: italic;
    }
    .scrub {
        width: 100%;
        margin-bottom: 6px;
        accent-color: #a13bff;
    }
    .time-row {
        display: flex;
        justify-content: space-between;
        font-family: 'VT323', monospace;
        font-size: 16px;
        letter-spacing: 1px;
        color: #39ff6e;
        background: #001a00;
        border: 2px inset #444;
        padding: 2px 8px;
        margin-bottom: 14px;
    }
    .transport {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
    }
    .transport button {
        font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
        font-size: 18px;
        background: #c8c8d4;
        border: 3px outset #e8e8f2;
        color: #111;
        padding: 8px 12px;
        cursor: pointer;
    }
    .transport button:hover:not(:disabled) {
        background: #dcdce6;
    }
    .transport button:active:not(:disabled) {
        border-style: inset;
    }
    .transport button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }
    .transport #playPauseBtn {
        background: #3bd85b;
        border-color: #a4f5b4;
        font-size: 20px;
        padding: 8px 16px;
    }
    .transport #playPauseBtn:hover:not(:disabled) {
        background: #4ef06f;
    }

    .list {
        flex: 1 1 auto;
        min-width: 0;
        background: #0a0a0a;
        border: 3px inset #444;
        padding: 10px 12px;
    }
    .group-heading {
        font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
        font-size: 13px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #ffe93b;
        margin: 18px 0 6px;
        padding-bottom: 4px;
        border-bottom: 2px dashed #555;
    }
    .group-heading:first-child {
        margin-top: 0;
    }
    .song-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 8px;
        border-bottom: 1px dotted #333;
        cursor: pointer;
    }
    .song-row:nth-child(even) {
        background: rgba(255, 255, 255, 0.03);
    }
    .song-row:hover {
        background: rgba(161, 59, 255, 0.15);
    }
    .song-row:hover .title {
        color: #ff3b3b;
    }
    .song-row.current {
        background: rgba(255, 233, 59, 0.12);
        border-bottom-color: #665500;
    }
    .song-row .title {
        flex: 1 1 auto;
        min-width: 0;
        font-size: 15px;
        color: #4ea8ff;
        text-decoration: underline;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .song-row.current .title {
        color: #ffe93b;
        font-weight: bold;
    }
    .song-row .now-icon {
        font-size: 13px;
        color: #ffe93b;
        width: 14px;
        flex-shrink: 0;
        text-align: center;
    }
    .song-row.external .title {
        color: #ff9d3b;
    }
    .song-row.missing {
        cursor: default;
    }
    .song-row.missing .title {
        color: #777;
        text-decoration: none;
        font-style: italic;
    }

    .state {
        text-align: center;
        color: #39ff6e;
        font-family: 'VT323', monospace;
        font-size: 20px;
        letter-spacing: 1px;
        margin-top: 30px;
        padding: 0 10px;
    }
    .state:not(:empty)::after {
        content: '_';
    }

    .unlock-gif {
        display: block;
        margin: 50px auto 0;
        cursor: pointer;
        image-rendering: pixelated;
    }

    @media (max-width: 640px) {
        .layout {
            flex-direction: column;
        }
        .player {
            position: static;
            width: 100%;
            flex-basis: auto;
        }
    }
</style>
</head>
<body>
<div class="wrap">
    <div id="projectBar" class="bar"></div>

    <div class="layout">
        <div class="player">
            <img class="cover" id="coverArt" alt="">
            <div class="project-tag" id="nowProject"></div>
            <div class="now-title placeholder" id="nowTitle">Pick a song to start</div>
            <input type="range" class="scrub" id="scrub" value="0" min="0" max="0" step="0.1" disabled>
            <div class="time-row"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
            <div class="transport">
                <button id="prevBtn" disabled title="Previous">&#9198;</button>
                <button id="playPauseBtn" disabled title="Play">&#9654;</button>
                <button id="nextBtn" disabled title="Next">&#9197;</button>
            </div>
            <audio id="audioEl" preload="none"></audio>
        </div>

        <div class="list" id="list"></div>
    </div>

    <div id="state" class="state"></div>

    <img id="unlockGif" class="unlock-gif" src="unlock.gif" alt="" width="64" height="64">
</div>

<script>
(function () {
    var OWNER = 'ReeveHunter';
    var REPO = 'ReeveHunter.github.io';
    var BRANCH = 'main';
    var SONGS_ROOT = 'tunes/songs/';
    var ORDER_FILE = 'tunes/project-order.txt';
    var PICKS_FILE = 'tunes/picks.txt';
    var AUDIO_EXT = /\.(mp3|wav|m4a|ogg|flac|aac)$/i;
    var IMAGE_EXT = /\.(png|jpe?g|gif|webp)$/i;
    var SECRET_NAME = 'secret';

    var listEl = document.getElementById('list');
    var stateEl = document.getElementById('state');
    var projectBarEl = document.getElementById('projectBar');

    var coverEl = document.getElementById('coverArt');
    var nowProjectEl = document.getElementById('nowProject');
    var nowTitleEl = document.getElementById('nowTitle');
    var scrubEl = document.getElementById('scrub');
    var curTimeEl = document.getElementById('curTime');
    var durTimeEl = document.getElementById('durTime');
    var prevBtn = document.getElementById('prevBtn');
    var playPauseBtn = document.getElementById('playPauseBtn');
    var nextBtn = document.getElementById('nextBtn');
    var audioEl = document.getElementById('audioEl');

    var activeView = { kind: 'all' }; // {kind:'all'} | {kind:'project', name} | {kind:'pick', name}
    var songs = []; // { path, title, project, folder, secret }
    var coverByFolder = {}; // folder -> image path (full repo path)
    var projectOrder = []; // names, in desired order, from ORDER_FILE
    var picks = []; // [{ name, entries: [{kind:'song',song}|{kind:'external',title,url}|{kind:'missing',title}] }]
    var picksByName = {};
    var currentPath = null;
    var scrubbing = false;
    var secretUnlocked = false;

    function titleFromFilename(name) {
        var base = name.replace(AUDIO_EXT, '');
        base = base.replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim();
        return base.replace(/\b\w/g, function (c, i, str) {
            var word = str.slice(str.lastIndexOf(' ', i) + 1).match(/^\S*/)[0];
            return word === word.toLowerCase() ? c.toUpperCase() : c;
        });
    }

    function normalizeTitle(t) {
        return t.toLowerCase()
            .replace(/^\d+\s+/, '')
            .replace(/[^a-z0-9 ]/g, '')
            .replace(/\s+/g, ' ')
            .trim();
    }

    function findSongByTitle(query) {
        var nq = normalizeTitle(query);
        for (var i = 0; i < songs.length; i++) {
            if (normalizeTitle(songs[i].title) === nq) return songs[i];
        }
        return null;
    }

    // "## Name" starts a new pick list (its button label). A line starting
    // with a single "#" (not "##") is just a comment and is ignored.
    // "Title = youtube:<url>" is an external link entry. Any other
    // non-blank line is a song title, matched fuzzily against songs[].
    function parsePicks(text) {
        var list = [];
        var current = null;
        text.split('\n').forEach(function (raw) {
            var line = raw.trim();
            if (!line) return;
            if (line.indexOf('##') === 0) {
                var name = line.slice(2).trim();
                if (!name) return;
                current = { name: name, entries: [] };
                list.push(current);
                return;
            }
            if (line.charAt(0) === '#') return; // comment
            if (!current) return;
            var eq = line.indexOf('=');
            if (eq !== -1) {
                var title = line.slice(0, eq).trim();
                var value = line.slice(eq + 1).trim();
                if (value.indexOf('youtube:') === 0) {
                    current.entries.push({ kind: 'external', title: title, url: value.slice('youtube:'.length).trim() });
                    return;
                }
            }
            var song = findSongByTitle(line);
            current.entries.push(song ? { kind: 'song', song: song } : { kind: 'missing', title: line });
        });
        return list;
    }

    function repoFileUrl(path) {
        return '/' + path.split('/').map(encodeURIComponent).join('/');
    }

    function fmtTime(sec) {
        if (!isFinite(sec) || sec < 0) sec = 0;
        var m = Math.floor(sec / 60);
        var s = Math.floor(sec % 60);
        return m + ':' + (s < 10 ? '0' : '') + s;
    }

    // Classify a path relative to SONGS_ROOT. Every top-level folder is a
    // project/tab, EXCEPT "secret" -- for that one, the folder *inside* it
    // (the album) becomes the project/tab instead, and it's marked secret
    // so it stays out of the tab bar until unlocked.
    function classify(relPath) {
        var parts = relPath.split('/');
        var filename = parts[parts.length - 1];
        if (parts.length === 1) {
            return { project: 'Uncategorized', folder: '', filename: filename, secret: false };
        }
        if (parts[0].toLowerCase() === SECRET_NAME) {
            if (parts.length >= 3) {
                return { project: parts[1], folder: parts.slice(0, 2).join('/'), filename: filename, secret: true };
            }
            return { project: 'Secret', folder: parts[0], filename: filename, secret: true };
        }
        return { project: parts[0], folder: parts[0], filename: filename, secret: false };
    }

    function songByPath(path) {
        for (var i = 0; i < songs.length; i++) {
            if (songs[i].path === path) return songs[i];
        }
        return null;
    }

    function compareProjectNames(a, b) {
        if (a === 'Uncategorized') return b === 'Uncategorized' ? 0 : 1;
        if (b === 'Uncategorized') return -1;
        var ia = projectOrder.indexOf(a);
        var ib = projectOrder.indexOf(b);
        if (ia === -1 && ib === -1) return a.localeCompare(b);
        if (ia === -1) return 1;
        if (ib === -1) return -1;
        return ia - ib;
    }
    function sortProjects(list) {
        list.sort(compareProjectNames);
        return list;
    }

    // songs currently visible given the project filter (and secret-lock),
    // in render order. Only meaningful for the 'all'/'project' views -- a
    // 'pick' view uses its own authored order (see currentPlayableList).
    function visibleSongs() {
        var list = songs.filter(function (s) {
            if (s.secret && !secretUnlocked) return false;
            return activeView.kind === 'all' || s.project === activeView.name;
        });
        list.sort(function (a, b) {
            if (a.project !== b.project) return compareProjectNames(a.project, b.project);
            return a.title.localeCompare(b.title);
        });
        return list;
    }

    // the ordered list of *playable* songs for whatever view is active --
    // what prev/next/auto-advance step through
    function currentPlayableList() {
        if (activeView.kind === 'pick') {
            var p = picksByName[activeView.name];
            if (!p) return [];
            return p.entries
                .filter(function (e) { return e.kind === 'song'; })
                .map(function (e) { return e.song; });
        }
        return visibleSongs();
    }

    function playSong(song) {
        currentPath = song.path;
        audioEl.src = repoFileUrl(song.path);
        audioEl.play().catch(function () {});
        renderPlayerInfo();
        renderList();
    }

    function renderPlayerInfo() {
        var song = currentPath ? songByPath(currentPath) : null;
        if (!song) {
            coverEl.classList.remove('show');
            nowProjectEl.textContent = '';
            nowTitleEl.textContent = 'Pick a song to start';
            nowTitleEl.classList.add('placeholder');
            prevBtn.disabled = true;
            playPauseBtn.disabled = songs.length === 0;
            nextBtn.disabled = true;
            playPauseBtn.innerHTML = '&#9654;';
            playPauseBtn.title = 'Play';
            return;
        }
        var cover = coverByFolder[song.folder];
        if (cover) {
            coverEl.src = repoFileUrl(cover);
            coverEl.classList.add('show');
        } else {
            coverEl.classList.remove('show');
        }
        nowProjectEl.textContent = song.project;
        nowTitleEl.textContent = song.title;
        nowTitleEl.classList.remove('placeholder');
        prevBtn.disabled = false;
        playPauseBtn.disabled = false;
        nextBtn.disabled = false;
        playPauseBtn.innerHTML = audioEl.paused ? '&#9654;' : '&#9208;';
        playPauseBtn.title = audioEl.paused ? 'Play' : 'Pause';
    }

    function step(delta) {
        var list = currentPlayableList();
        if (list.length === 0) return;
        var idx = list.findIndex(function (s) { return s.path === currentPath; });
        var nextIdx;
        if (idx === -1) {
            nextIdx = delta > 0 ? 0 : list.length - 1;
        } else {
            nextIdx = idx + delta;
            if (nextIdx < 0) nextIdx = list.length - 1;
            if (nextIdx >= list.length) nextIdx = 0;
        }
        playSong(list[nextIdx]);
    }

    playPauseBtn.addEventListener('click', function () {
        if (!currentPath) {
            step(1); // nothing picked yet -> play whatever's at the top of the current list
            return;
        }
        if (audioEl.paused) audioEl.play().catch(function () {});
        else audioEl.pause();
    });
    prevBtn.addEventListener('click', function () { step(-1); });
    nextBtn.addEventListener('click', function () { step(1); });

    audioEl.addEventListener('play', renderPlayerInfo);
    audioEl.addEventListener('pause', renderPlayerInfo);
    audioEl.addEventListener('ended', function () { step(1); });
    audioEl.addEventListener('loadedmetadata', function () {
        scrubEl.max = audioEl.duration || 0;
        scrubEl.disabled = false;
        durTimeEl.textContent = fmtTime(audioEl.duration);
    });
    audioEl.addEventListener('timeupdate', function () {
        if (scrubbing) return;
        scrubEl.value = audioEl.currentTime;
        curTimeEl.textContent = fmtTime(audioEl.currentTime);
    });
    scrubEl.addEventListener('input', function () {
        scrubbing = true;
        curTimeEl.textContent = fmtTime(scrubEl.value);
    });
    scrubEl.addEventListener('change', function () {
        audioEl.currentTime = parseFloat(scrubEl.value);
        scrubbing = false;
    });

    // click the sparkle at the bottom of the page to reveal the secret albums
    var unlockGifEl = document.getElementById('unlockGif');
    unlockGifEl.addEventListener('click', function () {
        if (secretUnlocked) return;
        secretUnlocked = true;
        unlockGifEl.style.display = 'none';
        renderList();
    });

    function buildSongRow(s) {
        var row = document.createElement('div');
        row.className = 'song-row' + (s.path === currentPath ? ' current' : '');
        row.onclick = function () { playSong(s); };

        var icon = document.createElement('span');
        icon.className = 'now-icon';
        icon.textContent = (s.path === currentPath && !audioEl.paused) ? '♪' : '';
        row.appendChild(icon);

        var title = document.createElement('div');
        title.className = 'title';
        title.textContent = s.title;
        row.appendChild(title);

        return row;
    }

    function buildExternalRow(title, url) {
        var row = document.createElement('div');
        row.className = 'song-row external';
        row.onclick = function () { window.open(url, '_blank', 'noopener'); };

        var icon = document.createElement('span');
        icon.className = 'now-icon';
        icon.textContent = '↗';
        row.appendChild(icon);

        var titleEl = document.createElement('div');
        titleEl.className = 'title';
        titleEl.textContent = title;
        row.appendChild(titleEl);

        return row;
    }

    function buildMissingRow(title) {
        var row = document.createElement('div');
        row.className = 'song-row missing';

        var icon = document.createElement('span');
        icon.className = 'now-icon';
        row.appendChild(icon);

        var titleEl = document.createElement('div');
        titleEl.className = 'title';
        titleEl.textContent = title;
        row.appendChild(titleEl);

        return row;
    }

    function renderList() {
        listEl.innerHTML = '';

        var visibleProjects = songs.reduce(function (acc, s) {
            if (s.secret && !secretUnlocked) return acc;
            if (acc.indexOf(s.project) === -1) acc.push(s.project);
            return acc;
        }, []);
        sortProjects(visibleProjects);

        projectBarEl.innerHTML = '';
        var allBtn = document.createElement('button');
        allBtn.className = 'pill' + (activeView.kind === 'all' ? ' active' : '');
        allBtn.textContent = 'All';
        allBtn.onclick = function () { activeView = { kind: 'all' }; renderList(); };
        projectBarEl.appendChild(allBtn);
        visibleProjects.forEach(function (p) {
            var b = document.createElement('button');
            b.className = 'pill' + (activeView.kind === 'project' && activeView.name === p ? ' active' : '');
            b.textContent = p;
            b.onclick = function () { activeView = { kind: 'project', name: p }; renderList(); };
            projectBarEl.appendChild(b);
        });
        picks.forEach(function (pick) {
            var b = document.createElement('button');
            b.className = 'pill' + (activeView.kind === 'pick' && activeView.name === pick.name ? ' active' : '');
            b.textContent = pick.name;
            b.onclick = function () { activeView = { kind: 'pick', name: pick.name }; renderList(); };
            projectBarEl.appendChild(b);
        });

        if (songs.length === 0) {
            return;
        }

        if (activeView.kind === 'pick') {
            var pick = picksByName[activeView.name];
            if (!pick || pick.entries.length === 0) {
                stateEl.textContent = 'Nothing in this list.';
                return;
            }
            stateEl.textContent = '';
            pick.entries.forEach(function (e) {
                if (e.kind === 'song') listEl.appendChild(buildSongRow(e.song));
                else if (e.kind === 'external') listEl.appendChild(buildExternalRow(e.title, e.url));
                else listEl.appendChild(buildMissingRow(e.title));
            });
            return;
        }

        var toShow = visibleSongs();
        if (toShow.length === 0) {
            stateEl.textContent = 'No songs in this project.';
            return;
        }
        stateEl.textContent = '';

        // group headings by project, but only when viewing "All" (a single
        // project tab is already just that one project, so no heading needed)
        var lastGroup = null;
        toShow.forEach(function (s) {
            if (activeView.kind === 'all' && s.project !== lastGroup) {
                var h = document.createElement('div');
                h.className = 'group-heading';
                h.textContent = s.project;
                listEl.appendChild(h);
                lastGroup = s.project;
            }
            listEl.appendChild(buildSongRow(s));
        });
    }

    renderPlayerInfo();
    stateEl.textContent = 'Loading songs…';

    var treeFetch = fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + '/git/trees/' + BRANCH + '?recursive=1')
        .then(function (res) {
            if (!res.ok) throw new Error('GitHub API returned ' + res.status);
            return res.json();
        });

    var orderFetch = fetch('https://raw.githubusercontent.com/' + OWNER + '/' + REPO + '/' + BRANCH + '/' + ORDER_FILE)
        .then(function (res) { return res.ok ? res.text() : ''; })
        .catch(function () { return ''; });

    var picksFetch = fetch('https://raw.githubusercontent.com/' + OWNER + '/' + REPO + '/' + BRANCH + '/' + PICKS_FILE)
        .then(function (res) { return res.ok ? res.text() : ''; })
        .catch(function () { return ''; });

    Promise.all([treeFetch, orderFetch, picksFetch])
        .then(function (results) {
            var data = results[0];
            var orderText = results[1];
            var picksText = results[2];

            projectOrder = orderText.split('\n')
                .map(function (l) { return l.trim(); })
                .filter(function (l) { return l && l.charAt(0) !== '#'; });

            var imageCandidates = {}; // folder -> [filenames]

            var tree = data.tree || [];
            tree.forEach(function (item) {
                if (item.type !== 'blob') return;
                if (item.path.indexOf(SONGS_ROOT) !== 0) return;
                var relPath = item.path.slice(SONGS_ROOT.length);

                if (AUDIO_EXT.test(item.path)) {
                    var info = classify(relPath);
                    songs.push({
                        path: item.path,
                        title: titleFromFilename(info.filename),
                        project: info.project,
                        folder: info.folder,
                        secret: info.secret
                    });
                } else if (IMAGE_EXT.test(item.path)) {
                    var imgInfo = classify(relPath);
                    (imageCandidates[imgInfo.folder] = imageCandidates[imgInfo.folder] || []).push(imgInfo.filename);
                }
            });

            Object.keys(imageCandidates).forEach(function (folder) {
                var names = imageCandidates[folder].slice().sort();
                var cover = names.find(function (n) { return /cover/i.test(n); }) || names[0];
                coverByFolder[folder] = SONGS_ROOT + (folder ? folder + '/' + cover : cover);
            });

            picks = parsePicks(picksText); // needs songs[] populated above, for title matching
            picksByName = {};
            picks.forEach(function (p) { picksByName[p.name] = p; });

            stateEl.textContent = songs.length === 0 ? 'No songs yet.' : '';
            renderPlayerInfo();
            renderList();
        })
        .catch(function () {
            stateEl.textContent = 'Couldn\'t load the song list right now.';
        });
})();
</script>
</body>
</html>
